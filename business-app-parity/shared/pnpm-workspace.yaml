# Match the existing lockfile override; retain package.json's npm override.
# pnpm 11 blocks dependency build scripts unless they are explicitly trusted.
# Restrict execution to the native build tools already used by the independent app.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  'miniflare>sharp': 0.35.4
