name: FIRE Gate8 Estimate Edit Uncertain-Save Recovery (OFFLINE)
on:
  pull_request:
    paths:
      - 'business-app-parity/shared/app/dashboard.tsx'
      - 'business-app-parity/shared/scripts/test-estimate-editor-uncertain-save.mjs'
      - 'business-app-parity/shared/scripts/test-estimate-editor-save-recovery.mjs'
      - '.github/workflows/fire-gate8-estimate-edit-uncertain-recovery.yml'
permissions:
  contents: read
jobs:
  verify-estimate-edit-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned offline dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript compile existing app
        run: pnpm exec tsc --noEmit --incremental false
      - name: Actual estimate editor financial Save and GET recovery fault-injection
        run: node scripts/test-estimate-editor-uncertain-save.mjs
      - name: Both actual estimate and invoice editor duplicate guard regression
        run: node scripts/test-estimate-editor-save-recovery.mjs
