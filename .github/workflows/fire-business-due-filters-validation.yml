name: FIRE owner task deadlines and mobile browser (non-deploying)

on:
  push:
    branches:
      - ci/fire-business-due-filters-2026-10-20

permissions:
  contents: read

jobs:
  task-deadlines:
    name: Local task deadlines, real Business React in Chrome and full shared build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated pinned Chrome driver
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Locate pre-installed Chrome without downloads
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: TypeScript and task deadline edge cases in owner local time
        run: |
          pnpm exec tsc --noEmit
          TZ=America/Chicago node scripts/test-task-due.mjs
          TZ=UTC node scripts/test-task-due.mjs
      - name: Real Business React mobile date/status filters across light and dark screens
        env:
          FIRE_UI_SCREENSHOT_DIR: ${{ runner.temp }}/fire-due-ui
        run: node scripts/test-business-records-browser.mjs
      - name: Save synthetic Business screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-due-task-mobile-ui
          path: ${{ runner.temp }}/fire-due-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Existing task save and status reliability checks
        run: |
          node scripts/test-business-list-recovery.mjs
          node scripts/test-business-restart-recovery.mjs
          node scripts/test-task-status-ui-recovery.mjs
          node --experimental-sqlite scripts/test-task-status-confirmation.mjs
      - name: Non-publishing full shared build
        run: pnpm run build
