name: FIRE G4 STAGING traffic switch offline
on:
  pull_request:
    paths:
      - 'business-app-parity/*traffic*switch*'
      - '.github/workflows/fire-g4-staging-traffic-switch.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse Windows PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'business-app-parity/owner_staging_traffic_switch.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'PowerShell parser failed' }
      - name: Offline traffic switch controls
        shell: pwsh
        run: |
          node --check business-app-parity/owner_staging_traffic_switch.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node business-app-parity/test-staging-traffic-switch.mjs
