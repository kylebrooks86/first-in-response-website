      - 'business-app-parity/qa_evidence_intake.py'
      - 'business-app-parity/test_qa_evidence_intake.py'
      - 'business-app-parity/capture_qa_provider_identity.py'
      - 'business-app-parity/test_capture_qa_provider_identity.py'
      - 'business-app-parity/QA_BACKUP_CUSTODY.example.json'
      - 'business-app-parity/test_owner_windows_qa_update_review.py'
      - 'business-app-parity/owner_windows_qa_update_publish.ps1'
      - 'business-app-parity/test_owner_windows_qa_update_publish.py'
      - 'business-app-parity/prepare_qa_deploy_config.mjs'
      - 'business-app-parity/test_prepare_qa_deploy_config.mjs'
