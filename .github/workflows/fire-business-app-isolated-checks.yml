name: FIRE Business App Isolated Checks

on:
  push:
    branches:
      - work/fire-business-app-parity-2026-10-08
    paths:
      - 'fire-app-dr/**'
      - 'business-app-parity/shared/**'
      - 'business-app-parity/adapters/**'
      - 'business-app-parity/materialize.py'
      - 'business-app-parity/verify_materialized_candidate.py'
      - 'business-app-parity/candidate_release_manifest.py'
      - 'business-app-parity/prepare_device_review.py'
      - 'business-app-parity/test_prepare_device_review.py'
      - 'business-app-parity/verify_device_review_packet.py'
      - 'business-app-parity/test_verify_device_review_packet.py'
      - 'business-app-parity/check_qa_runtime_config.mjs'
      - 'business-app-parity/RELEASE_SCHEMA_CAPTURE_READ_ONLY.sql'
      - 'business-app-parity/verify_hosted_schema_capture.py'
      - 'business-app-parity/capture_doomsday_schema_read_only.py'
      - 'business-app-parity/test_capture_doomsday_schema_read_only.py'
      - 'business-app-parity/capture_doomsday_worker_identity_read_only.py'
      - 'business-app-parity/test_capture_doomsday_worker_identity_read_only.py'
      - 'business-app-parity/check_isolated_cloudflare_free_preflight.py'
      - 'business-app-parity/test_check_isolated_cloudflare_free_preflight.py'
      - 'business-app-parity/compare_doomsday_pre0022_capture.py'
      - 'business-app-parity/test_compare_doomsday_pre0022_capture.py'
      - 'business-app-parity/test_hosted_schema_capture.py'
      - 'business-app-parity/test_release_schema_capture.py'
      - 'business-app-parity/DOOMSDAY_0022_OWNER_CONSOLE_READ_ONLY.sql'
      - 'business-app-parity/test_doomsday_owner_console.py'
      - 'business-app-parity/DOOMSDAY_LEDGER_OWNER_AGGREGATE_READ_ONLY.sql'
      - 'business-app-parity/test_doomsday_ledger_owner_aggregate.py'
      - 'business-app-parity/verify_doomsday_d1_export.py'
      - 'business-app-parity/test_doomsday_export_restore.py'
      - 'business-app-parity/rehearse_doomsday_0022_export.py'
      - 'business-app-parity/test_doomsday_0022_export_rehearsal.py'
      - 'business-app-parity/owner_windows_doomsday_backup.ps1'
      - 'business-app-parity/test_owner_windows_backup_script.py'
      - 'business-app-parity/owner_windows_prepare_qa_credentials.ps1'
      - 'business-app-parity/test_owner_windows_prepare_qa_credentials.py'
      - 'business-app-parity/wrangler.qa-migrations.json'
      - 'business-app-parity/owner_windows_initialize_qa_d1.ps1'
      - 'business-app-parity/test_owner_windows_initialize_qa_d1.py'
      - 'business-app-parity/shared/scripts/test-real-wrangler-local-d1-export.mjs'
      - 'business-app-parity/shared/scripts/test-fire-service-catalog-pricing.mjs'
      - 'business-app-parity/shared/scripts/test-per-job-price-overrides.mjs'
      - 'business-app-parity/shared/scripts/test-editable-line-totals.mjs'
      - 'business-app-parity/shared/scripts/test-stripe-isolation.mjs'
      - 'scripts/deploy-fire-dr-staging.sh'
      - '.github/workflows/fire-business-app-isolated-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fire-business-app-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-build:
    name: Typecheck, recovery contracts, and independent candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: fire-app-dr
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript
        run: pnpm run typecheck
      - name: Verify restore contract
        run: pnpm run restore:verify-contract
      - name: Verify recovery documentation
        run: pnpm run release:docs:check
      - name: Synthetic payment, refund, and backup regression tests
        run: node --experimental-sqlite scripts/test-processing-fees.mjs
      - name: Source-only independent preflight
        run: pnpm run preflight:independent
      - name: Verify release-readiness source policy
        run: pnpm run release:readiness
      - name: Synthetic independent owner auth and signed session regression
        # This adapter test targets the DR owner-auth implementation, not the
        # shared candidate's ChatGPT gateway authentication.
        run: |
          cp ../business-app-parity/shared/scripts/test-independent-auth-adapter.mjs scripts/.independent-auth-ci.mjs
          node scripts/.independent-auth-ci.mjs
          rm scripts/.independent-auth-ci.mjs
      # Values below refer to NO real resources and are intentionally scoped to
      # this build step. Never add a deploy or wrangler remote command to CI.
      - name: Build independent candidate with disposable config identities
        env:
          FIRE_WORKER_NAME: fire-app-ci-synthetic-do-not-deploy
          FIRE_D1_DATABASE_NAME: fire-app-ci-synthetic-no-database
          FIRE_D1_DATABASE_ID: 12345678-1234-4234-8234-123456789abc
          FIRE_R2_BUCKET_NAME: fire-app-ci-synthetic-no-bucket
        run: pnpm run build:independent
      - name: Verify optional R2 configuration and D1-only independent Worker build
        run: node scripts/test-independent-wrangler-d1-only.mjs
      - name: Rehearse local synthetic D1 and R2 photo recovery
        run: node scripts/test-local-photo-restore.mjs

  shared-candidate:
    name: Shared-source candidate — finance, schema, parity, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Checkout development branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install shared-source dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Shared TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Local migration and schema-journal integrity
        run: |
          node --experimental-sqlite scripts/test-local-schema-audit.mjs
          node --experimental-sqlite scripts/test-candidate-db-preflight.mjs
      - name: Shared-source parity gate regression
        run: node scripts/test-parity-gate.mjs
      - name: Governed Doomsday deployment fail-closed policy (no execution)
        run: node scripts/test-governed-deploy-guards.mjs
      - name: Device review archive privacy, exact bytes, non-overwrite and cleanup
        run: python3 ../test_prepare_device_review.py
      - name: Reject swapped, forged and unsafe full-app review ZIPs
        run: python3 ../test_verify_device_review_packet.py
      - name: Release-manifest integrity, source drift and negative controls
        run: python3 ../test_candidate_release_manifest.py
      - name: Read-only hosted schema capture coverage and mismatch negative controls
        run: |
          python3 ../test_release_schema_capture.py
          python3 ../test_hosted_schema_capture.py
      - name: Owner-safe read-only D1 capture and historical pre-0022 comparator security regressions
        run: |
          python3 ../test_capture_doomsday_schema_read_only.py
          python3 ../test_compare_doomsday_pre0022_capture.py
      - name: Active independent Worker-to-D1 read-only identity negative controls
        run: python3 ../test_capture_doomsday_worker_identity_read_only.py
      - name: Cloudflare Free-plan QA isolated D1 count read-only checks and negative controls
        run: python3 ../test_check_isolated_cloudflare_free_preflight.py
      - name: Owner-safe remote 0022 evidence query and synthetic integrity states
        run: |
          python3 ../test_doomsday_owner_console.py
          python3 ../test_doomsday_ledger_owner_aggregate.py
      - name: Verify private SQL-export offline restore and anti-tamper controls
        run: python3 ../test_doomsday_export_restore.py
      - name: Rehearse exact Doomsday 0022 index on synthetic restored D1 exports with local rollback
        run: python3 ../test_doomsday_0022_export_rehearsal.py
      - name: Check owner Windows private backup export script fail-closed policy and dry-run
        run: python3 ../test_owner_windows_backup_script.py
      - name: QA owner credential provisioning must be private, no-op by default and unbound to production
        run: python3 ../test_owner_windows_prepare_qa_credentials.py
      - name: QA-only remote D1 initializer must not write without exact owner acknowledgement
        run: python3 ../test_owner_windows_initialize_qa_d1.py
      - name: QA post-migration full-app preflight must remain read-only and preserve private owner credentials
        run: python3 ../test_owner_windows_qa_release_preflight.py
      - name: Verify real Wrangler local D1 export and private SQL restoration
        run: node scripts/test-real-wrangler-local-d1-export.mjs
      - name: Protect owner-approved FIRE service rates in the shared source
        run: node --experimental-strip-types scripts/test-fire-service-catalog-pricing.mjs
      - name: Verify all thirty starting rates remain fully adjustable per job
        run: node --experimental-strip-types scripts/test-per-job-price-overrides.mjs
      - name: Preserve historical estimate and invoice line totals during no-op edits
        run: node --experimental-strip-types scripts/test-editable-line-totals.mjs
      - name: Shared financial regression suite
        run: node --experimental-sqlite scripts/run-ci-regression.mjs ./test-processing-fees.mjs
      - name: Verify on-device customer photo ZIP integrity and owner UI integration
        run: node scripts/test-offline-photo-vault.mjs
      - name: Shared photo storage integrity regression
        run: node --experimental-sqlite scripts/test-photo-storage-integrity.mjs
      - name: Offline photo archive and records recovery pairing — no mutations
        run: python3 scripts/test-plan-complete-photo-recovery.py
      - name: Synthetic record-backup restore and rollback fault rehearsal
        run: node --experimental-sqlite scripts/run-ci-regression.mjs ./test-records-recovery.mjs
      - name: Verify final tips and interrupted-payment recovery against actual modules
        run: node --experimental-sqlite scripts/run-ci-regression.mjs ./test-final-tipping.mjs
      - name: Verify pinned Stripe connection diagnostics and strict USD reconciliation
        run: node scripts/test-stripe-connection-inspection.mjs
      - name: Verify Stripe test-only guard for isolated candidates
        run: node scripts/test-stripe-isolation.mjs
      - name: Verify atomic checkout reservation and duplicate-charge prevention
        run: node scripts/test-checkout-atomic-reservation.mjs
      - name: Recover owner-selected paid and expired Stripe checkouts without duplicate charges
        run: node --experimental-sqlite scripts/test-checkout-owner-reconciliation.mjs
      - name: Verify manual payment retries preserve same cents and ID across iPhone restarts
        run: node --experimental-strip-types scripts/test-manual-payment-retry-state.mjs
      - name: Verify refund request survives iPhone app restart and uncertain responses
        run: node --experimental-strip-types scripts/test-refund-retry-state.mjs
      - name: Synthetic Stripe refund and webhook replay regression
        run: node --experimental-sqlite scripts/run-ci-regression.mjs ./test-stripe-refunds.mjs
      - name: Synthetic photo upload and delete integrity regression
        run: |
          node scripts/test-photo-upload-integrity.mjs
          node scripts/test-photo-delete-integrity.mjs
      - name: Validate isolated offline Pages package and negative security controls
        run: node scripts/verify-synthetic-pages-package.mjs
      - name: Prepare reviewed synthetic-only Home Screen testing package
        run: |
          node scripts/prepare-local-customer-pages.mjs "$RUNNER_TEMP/fire-synthetic-pages-review"
          node scripts/verify-synthetic-pages-package.mjs "$RUNNER_TEMP/fire-synthetic-pages-review"
      - name: Archive review-only package for later separate owner approval
        uses: actions/upload-artifact@v4
        with:
          name: fire-synthetic-pwa-review-${{ github.sha }}
          path: ${{ runner.temp }}/fire-synthetic-pages-review/
          if-no-files-found: error
          retention-days: 7
      - name: Build shared candidate without deployment
        run: pnpm run build

  coordinated-candidates:
    name: Coordinated ${{ matrix.target }} candidate — exact source, schema, finance, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [live, doomsday, staging]
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout development branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Materialize isolated coordinated candidate
        run: python3 business-app-parity/materialize.py "${{ matrix.target }}" "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
      - name: Verify exact candidate fingerprints, adapter boundaries and migration sequence
        run: python3 business-app-parity/verify_materialized_candidate.py "${{ matrix.target }}" "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
      - name: Install candidate dependencies from immutable lockfile
        run: |
          cd "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
          pnpm install --frozen-lockfile
      - name: Typecheck actual materialized candidate
        run: |
          cd "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
          pnpm exec tsc --noEmit
      - name: Rehearse candidate's target-specific migrations in disposable SQLite
        run: |
          cd "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
          node --experimental-sqlite scripts/test-local-schema-audit.mjs
          node --experimental-sqlite scripts/test-candidate-db-preflight.mjs
      - name: Regress candidate financial behavior with synthetic data
        run: |
          cd "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
          node --experimental-sqlite scripts/run-ci-regression.mjs ./test-processing-fees.mjs
      - name: Physical SQLite rollback, journal/index preservation, and anti-tamper checks
        env:
          FIRE_SYNTHETIC_TARGET: ${{ matrix.target }}
        run: |
          cd "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
          node --experimental-sqlite scripts/test-physical-rollback.mjs
      - name: Build materialized candidate without publishing
        run: |
          cd "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate"
          pnpm run build

      - name: Seal exact full-app candidate source and build for separate device-hosting review
        run: |
          python3 business-app-parity/prepare_device_review.py \
            --target "${{ matrix.target }}" \
            --candidate "$RUNNER_TEMP/fire-${{ matrix.target }}-candidate" \
            --output "$RUNNER_TEMP/fire-${{ matrix.target }}-device-review" \
            --checkpoint "$GITHUB_SHA"
      - name: Reopen and independently verify sealed full-app review ZIP against exact CI source commit
        run: |
          python3 business-app-parity/verify_device_review_packet.py \
            --packet "$RUNNER_TEMP/fire-${{ matrix.target }}-device-review" \
            --target "${{ matrix.target }}" \
            --checkpoint "$GITHUB_SHA"
      - name: Retain isolated full-app review bundle without publishing
        uses: actions/upload-artifact@v4
        with:
          name: fire-full-app-review-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/fire-${{ matrix.target }}-device-review/
          if-no-files-found: error
          retention-days: 7

  synthetic-full-app-qa:
    name: Isolated synthetic QA full-app — auth, payment refusals, schema, build, sealed review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout review-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Materialize separate QA application (never deploy)
        run: python3 business-app-parity/materialize.py qa "$RUNNER_TEMP/fire-qa-candidate"
      - name: Verify exact shared plus two-layer authenticated QA source assembly
        run: python3 business-app-parity/verify_materialized_candidate.py qa "$RUNNER_TEMP/fire-qa-candidate"
      - name: Install QA build dependencies from existing lockfile
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          pnpm install --frozen-lockfile
      - name: QA TypeScript verification
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          pnpm exec tsc --noEmit
      - name: Verify QA's disposable full schema, never any hosted DB
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          node --experimental-sqlite scripts/test-local-schema-audit.mjs
          node --experimental-sqlite scripts/test-candidate-db-preflight.mjs
      - name: QA independent passphrase, cookie, spoofed-header and wrong-origin regression
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          node scripts/test-qa-auth-adapter.mjs
      - name: Real QA payment route guards reject checkout/refund/webhooks before provider or DB
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          node scripts/test-stripe-isolation.mjs
      - name: Verify hosted QA offline customer vault and separate installed PWA identity
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          node scripts/test-hosted-qa-local-customers.mjs
      - name: Build entire QA Business App candidate without publishing
        run: |
          cd "$RUNNER_TEMP/fire-qa-candidate"
          pnpm run build
      - name: Fail closed unless built QA manifest binds only the newly created isolated D1
        run: node business-app-parity/check_qa_runtime_config.mjs "$RUNNER_TEMP/fire-qa-candidate/dist/server/wrangler.json"
      - name: Seal synthetic-only QA full-app review bundle
        run: |
          python3 business-app-parity/prepare_device_review.py \
            --target qa \
            --candidate "$RUNNER_TEMP/fire-qa-candidate" \
            --output "$RUNNER_TEMP/fire-qa-review" \
            --checkpoint "$GITHUB_SHA"
      - name: Check exact QA source, build ID and every ZIP hash before upload
        run: |
          python3 business-app-parity/verify_device_review_packet.py \
            --packet "$RUNNER_TEMP/fire-qa-review" \
            --target qa \
            --checkpoint "$GITHUB_SHA"
      - name: Archive QA source/build for separate future owner-authorized hosting
        uses: actions/upload-artifact@v4
        with:
          name: fire-full-app-review-qa-${{ github.sha }}
          path: ${{ runner.temp }}/fire-qa-review/
          if-no-files-found: error
          retention-days: 7

  offline-browser:
    name: Isolated synthetic Home Screen offline cold-launch browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Checkout development branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install shared dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install isolated pinned Playwright driver (no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Locate GitHub runner's pre-installed Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "Chrome is not available on the runner; do not fall back to unreviewed installs."; exit 1; }
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Verify actual IndexedDB customer photos, ZIP restore and offline additions in Chrome
        run: node scripts/test-offline-photo-indexeddb-browser.mjs
      - name: Exercise actual photo screen, offline ZIP, stopped-server cold launch and Files readback
        run: node scripts/test-offline-photo-ui-browser.mjs
      - name: Exercise actual Customers dashboard offline-photo fallback, authenticated directory and 401 revocation
        run: node scripts/test-actual-customer-photo-fallback-browser.mjs
      - name: Test native Chromium persistent profile and offline cold launch
        run: node scripts/test-local-customer-demo-cold-browser.mjs
      - name: Test portable synthetic PWA export, install assets and offline recovery
        run: node scripts/test-local-customer-demo-package.mjs
      - name: Test exact-origin HTTPS Pages fixture, CSP and service-worker scope
        run: node scripts/test-local-customer-pages-browser.mjs
      - name: Exercise actual guarded React offline-customer screen and synthetic auth in Chrome
        run: node scripts/test-candidate-local-customers-browser.mjs
