      - 'business-app-parity/shared/scripts/test-real-wrangler-local-d1-export.mjs'
      - 'business-app-parity/shared/scripts/test-fire-service-catalog-pricing.mjs'
      - 'business-app-parity/shared/scripts/test-per-job-price-overrides.mjs'
      - 'business-app-parity/shared/scripts/test-editable-line-totals.mjs'
      - 'business-app-parity/shared/scripts/test-stripe-isolation.mjs'
      - 'scripts/deploy-fire-dr-staging.sh'
      - '.github/workflows/fire-business-app-isolated-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fire-business-app-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-build:
    name: Typecheck, recovery contracts, and independent candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: fire-app-dr
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript
        run: pnpm run typecheck
      - name: Verify restore contract
        run: pnpm run restore:verify-contract
      - name: Verify recovery documentation
        run: pnpm run release:docs:check
      - name: Synthetic payment, refund, and backup regression tests
        run: node --experimental-sqlite scripts/test-processing-fees.mjs
      - name: Source-only independent preflight
        run: pnpm run preflight:independent
      - name: Verify release-readiness source policy
        run: pnpm run release:readiness
      - name: Synthetic independent owner auth and signed session regression
        # This adapter test targets the DR owner-auth implementation, not the
        # shared candidate's ChatGPT gateway authentication.
        run: |
          cp ../business-app-parity/shared/scripts/test-independent-auth-adapter.mjs scripts/.independent-auth-ci.mjs
          node scripts/.independent-auth-ci.mjs
          rm scripts/.independent-auth-ci.mjs
      # Values below refer to NO real resources and are intentionally scoped to
      # this build step. Never add a deploy or wrangler remote command to CI.
      - name: Build independent candidate with disposable config identities
        env:
          FIRE_WORKER_NAME: fire-app-ci-synthetic-do-not-deploy
          FIRE_D1_DATABASE_NAME: fire-app-ci-synthetic-no-database
          FIRE_D1_DATABASE_ID: 12345678-1234-4234-8234-123456789abc
          FIRE_R2_BUCKET_NAME: fire-app-ci-synthetic-no-bucket
        run: pnpm run build:independent
      - name: Verify optional R2 configuration and D1-only independent Worker build
        run: node scripts/test-independent-wrangler-d1-only.mjs
      - name: Rehearse local synthetic D1 and R2 photo recovery
        run: node scripts/test-local-photo-restore.mjs

  shared-candidate:
    name: Shared-source candidate — finance, schema, parity, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Checkout development branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install shared-source dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Shared TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Local migration and schema-journal integrity
        run: |
          node --experimental-sqlite scripts/test-local-schema-audit.mjs
          node --experimental-sqlite scripts/test-candidate-db-preflight.mjs
      - name: Shared-source parity gate regression
        run: node scripts/test-parity-gate.mjs
      - name: Governed Doomsday deployment fail-closed policy (no execution)
        run: node scripts/test-governed-deploy-guards.mjs
      - name: Device review archive privacy, exact bytes, non-overwrite and cleanup
        run: python3 ../test_prepare_device_review.py
      - name: Reject swapped, forged and unsafe full-app review ZIPs
        run: python3 ../test_verify_device_review_packet.py
      - name: Release-manifest integrity, source drift and negative controls
        run: python3 ../test_candidate_release_manifest.py
      - name: Read-only hosted schema capture coverage and mismatch negative controls
        run: |
          python3 ../test_release_schema_capture.py
          python3 ../test_hosted_schema_capture.py
      - name: Owner-safe read-only D1 capture and historical pre-0022 comparator security regressions
        run: |
          python3 ../test_capture_doomsday_schema_read_only.py
          python3 ../test_compare_doomsday_pre0022_capture.py
      - name: Active independent Worker-to-D1 read-only identity negative controls
        run: python3 ../test_capture_doomsday_worker_identity_read_only.py
      - name: Cloudflare Free-plan QA isolated D1 count read-only checks and negative controls
        run: python3 ../test_check_isolated_cloudflare_free_preflight.py
      - name: Owner-safe remote 0022 evidence query and synthetic integrity states
        run: |
          python3 ../test_doomsday_owner_console.py
          python3 ../test_doomsday_ledger_owner_aggregate.py
      - name: Verify private SQL-export offline restore and anti-tamper controls
        run: python3 ../test_doomsday_export_restore.py
      - name: Rehearse exact Doomsday 0022 index on synthetic restored D1 exports with local rollback
        run: python3 ../test_doomsday_0022_export_rehearsal.py
      - name: Check owner Windows private backup export script fail-closed policy and dry-run
        run: python3 ../test_owner_windows_backup_script.py
      - name: QA owner credential provisioning must be private, no-op by default and unbound to production
        run: python3 ../test_owner_windows_prepare_qa_credentials.py
      - name: QA-only remote D1 initializer must not write without exact owner acknowledgement
        run: python3 ../test_owner_windows_initialize_qa_d1.py
      - name: QA post-migration full-app preflight must remain read-only and preserve private owner credentials
        run: python3 ../test_owner_windows_qa_release_preflight.py
      - name: Windows full-app QA build must preserve original apps, records, secrets and target identity
        run: python3 ../test_owner_windows_build_qa_candidate.py
      - name: First QA Worker publication must require exact owner consent and preserve secrets
        run: python3 ../test_owner_windows_first_qa_publish.py
      - name: Cloudflare D1 list identity regression — exact UUID, protected staging and negative cases
        shell: pwsh
        run: ../test_qa_d1_identity_from_list.ps1
      - name: "Pinned read-only QA schema delta: refuse all unreviewed original and appended SQL"
        run: |
          python3 ../test_review_qa_update_schema.py
          python3 ../test_qa_migration_line_endings.py
      - name: Rehearse original 23 to additive 25 QA migrations in disposable SQLite only
        run: |
          python3 ../test_rehearse_qa_additive_schema.py
          python3 ../test_capture_existing_qa_schema_read_only.py
          python3 ../test_review_existing_qa_capture_offline.py
          python3 ../test_qa_iphone_release_readiness.py
          python3 ../test_qa_guarded_update.py
          python3 ../test_qa_evidence_intake.py
          python3 ../test_capture_qa_provider_identity.py
          python3 ../test_qa_d1_export.py
      - name: Existing QA Worker update review must preserve all hosted customer records
        run: python3 ../test_owner_windows_qa_update_review.py
      - name: Code-only QA Worker updates must require distinct approval and preserve login/data
        run: python3 ../test_owner_windows_qa_update_publish.py
      - name: QA private backup helper parses and defaults to no network or writes
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '../owner_windows_qa_backup.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw 'QA backup helper syntax failed.' }
          ../owner_windows_qa_backup.ps1 -PrivateFolder (Join-Path $env:RUNNER_TEMP 'FIRE-Private-Backups')
      - name: Windows QA update publisher parses without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '../owner_windows_qa_update_publish.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "FIRE QA update publisher contains syntax errors."
          }
          Write-Host 'PASS: QA update publisher parses, no remote writes.'
      - name: Windows QA update review script parses without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '../owner_windows_qa_update_review.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "FIRE QA update review contains syntax errors."
          }
          Write-Host 'PASS: QA update review parses; no deployment was executed.'
      - name: Ensure QA Worker release script parses under PowerShell without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '../owner_windows_first_qa_publish.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "FIRE QA Windows publish script contains PowerShell syntax errors."
          }
          Write-Host 'PASS: First QA release script parses without executing deployment.'
      - name: QA deployment manifest compatibility must change exactly legacy_env=true
        run: node ../test_prepare_qa_deploy_config.mjs
      - name: Verify real Wrangler local D1 export and private SQL restoration
        run: |
          node scripts/test-real-wrangler-local-d1-export.mjs
          node scripts/test-real-wrangler-local-d1-export.mjs --qa
      - name: Protect owner-approved FIRE service rates in the shared source
        run: node --experimental-strip-types scripts/test-fire-service-catalog-pricing.mjs
      - name: Custom standard pricing, real SQLite persistence, conflicts and historical protection
        run: node --experimental-sqlite scripts/test-custom-service-pricing.mjs
      - name: Saved promotions catalog date and discount eligibility contract
        run: node --experimental-sqlite scripts/test-saved-promotions.mjs
      - name: Server-side saved promotion preview with verified Tulsa date and booking hold
        run: node --experimental-sqlite scripts/test-saved-promotion-preview.mjs
      - name: Atomic per-estimate verified promotion attribution and owner-only readback
        run: node --experimental-sqlite scripts/test-estimate-promotion-attribution.mjs
      - name: Existing quote read-only booking amendment regression on SQLite
        run: node --experimental-sqlite scripts/test-post-estimate-booking-preview.mjs
      - name: Owner saved booking review staging and CAS on SQLite
        run: node --experimental-sqlite scripts/test-promotion-review-drafts.mjs
      - name: Strict owner-only revised-estimate review worksheet, signed hold and immutable ledger
        run: node --experimental-sqlite scripts/test-amendment-review-worksheet.mjs
      - name: Strict invoice and estimate discount entry, caps and exact-cent preview
        run: node --experimental-strip-types scripts/test-quote-discount-input.mjs
      - name: Stacked estimate discounts and atomic synthetic SQLite persistence
        run: node --experimental-sqlite scripts/test-stacked-estimate-discounts.mjs
      - name: Verify all thirty starting rates remain fully adjustable per job
        run: node --experimental-strip-types scripts/test-per-job-price-overrides.mjs
      - name: Preserve historical estimate and invoice line totals during no-op edits
        run: node --experimental-strip-types scripts/test-editable-line-totals.mjs
      - name: iPhone and iPad Edit Estimate modal viewport accessibility — no remote changes
        run: node scripts/test-estimate-editor-viewport.mjs
      - name: Keep customer-facing estimate and invoice system messages branded
        run: |
          node --experimental-strip-types scripts/test-customer-facing-brand-copy.mjs
          node --experimental-strip-types scripts/test-business-template-compatibility.mjs
      - name: Ensure phone and iPad payment shortcut visible, QA layout diagnostic not in production builds
        run: node scripts/test-mobile-payment-shortcut.mjs
      - name: Shared financial regression suite
        run: |
          node --experimental-sqlite scripts/run-ci-regression.mjs ./test-processing-fees.mjs
          node --experimental-sqlite scripts/test-customer-invoice-balances.mjs
          node --experimental-sqlite scripts/test-invoice-current-state.mjs
          node --experimental-sqlite scripts/test-change-request-history.mjs
          node --experimental-sqlite scripts/test-global-search.mjs
          node --experimental-sqlite scripts/test-deposit-policy.mjs
           node --experimental-sqlite scripts/test-deposit-audit-storage.mjs
           node --experimental-sqlite scripts/test-deposit-exception-transaction.mjs
           node scripts/test-deposit-agreement-disclosure.mjs
           node --experimental-sqlite scripts/test-deposit-revised-signature.mjs
           node scripts/test-owner-deposit-review.mjs
           node scripts/test-job-tools-mobile-save.mjs
           node scripts/test-job-report-recovery.mjs
           node scripts/test-job-cost-recovery.mjs
           node scripts/test-estimate-detail-recovery.mjs
           node scripts/test-estimate-editor-save-recovery.mjs
           node scripts/test-invoice-editor-load-recovery.mjs
           node scripts/test-deposit-exception-proposals.mjs
          node --experimental-sqlite scripts/test-public-estimate-retry.mjs
          node --experimental-sqlite scripts/test-manual-payment-confirmation.mjs
          node --experimental-sqlite scripts/test-customer-create-retry.mjs
          node scripts/test-payment-load-errors.mjs
          node scripts/test-schedule-load-errors.mjs
          node scripts/test-agreement-load-errors.mjs
          node scripts/test-complete-estimate-pages.mjs
          node scripts/test-payment-mobile-ui.mjs
          node scripts/test-customer-load-recovery.mjs
          node scripts/test-customer-write-recovery.mjs
          node --experimental-sqlite scripts/test-customer-note-idempotency.mjs
          node scripts/test-estimate-history-recovery.mjs
          node scripts/test-insights-recovery.mjs
          node scripts/test-detail-selection-recovery.mjs
          node scripts/test-schedule-timezones.mjs
      - name: Guard consolidated Business saves, restart recovery and CSV exports
        run: |
          node scripts/test-business-create-receipt.mjs
          node --experimental-sqlite scripts/test-dashboard-yard-signs.mjs
          node --experimental-sqlite scripts/test-dashboard-review-checks.mjs
          node --experimental-sqlite scripts/test-business-idempotent-routes.mjs
          node scripts/test-business-write-recovery.mjs
          node scripts/test-business-restart-recovery.mjs
          node scripts/test-business-list-recovery.mjs
          TZ=America/Chicago node scripts/test-task-due.mjs
          node scripts/test-expense-date.mjs
          node --experimental-sqlite scripts/test-expense-csv-safety.mjs
      - name: Confirm task status safely with SQLite and real BusinessView handlers
        run: |
          node --experimental-sqlite scripts/test-task-status-confirmation.mjs
          node scripts/test-task-status-ui-recovery.mjs
          node scripts/test-business-task-context.mjs
          node scripts/test-business-task-focus-recovery.mjs
      - name: Verify follow-up retry, authenticated list recovery and notification receipts
        run: |
          node scripts/test-followup-action-retry.mjs
          node --experimental-sqlite scripts/test-followup-concurrent-idempotency.mjs
           node scripts/test-followup-triage.mjs
          node scripts/test-followup-exact-lookup.mjs
          node scripts/test-followup-today-actions.mjs
          node scripts/test-followup-load-errors.mjs
          node scripts/test-notification-read-recovery.mjs
          node scripts/test-attention-flag-dedupe.mjs
          node scripts/test-notification-attention.mjs
      - name: Verify on-device customer photo ZIP integrity and owner UI integration
        run: node scripts/test-offline-photo-vault.mjs
      - name: Shared photo storage integrity regression
        run: node --experimental-sqlite scripts/test-photo-storage-integrity.mjs
      - name: Offline photo archive and records recovery pairing — no mutations
        run: python3 scripts/test-plan-complete-photo-recovery.py
      - name: Synthetic record-backup restore and rollback fault rehearsal
        run: node --experimental-sqlite scripts/run-ci-regression.mjs ./test-records-recovery.mjs
      - name: Verify final tips and interrupted-payment recovery against actual modules
        run: node --experimental-sqlite scripts/run-ci-regression.mjs ./test-final-tipping.mjs
      - name: Verify pinned Stripe connection diagnostics and strict USD reconciliation
        run: node scripts/test-stripe-connection-inspection.mjs
      - name: Verify Stripe test-only guard for isolated candidates
        run: node scripts/test-stripe-isolation.mjs
      - name: Verify atomic checkout reservation and duplicate-charge prevention
        run: node scripts/test-checkout-atomic-reservation.mjs
      - name: Recover owner-selected paid and expired Stripe checkouts without duplicate charges
        run: node --experimental-sqlite scripts/test-checkout-owner-reconciliation.mjs
      - name: Verify manual payment retries preserve same cents and ID across iPhone restarts
        run: node --experimental-strip-types scripts/test-manual-payment-retry-state.mjs
      - name: Verify payment entry never claims an unpaid estimate has a recorded deposit
        run: node scripts/test-payment-entry-state.mjs
      - name: Verify customer review invitations only after verified final payment
        run: node scripts/test-review-after-payment.mjs
      - name: Verify mobile SMS and email prepared-message recovery with scoped owner history
        run: node --experimental-sqlite scripts/test-pending-customer-messages.mjs
      - name: Verify idempotent text and email preparation and mobile retries
        run: |
          node --experimental-sqlite scripts/test-message-preparation-idempotency.mjs
          node scripts/test-message-confirmation.mjs
          node scripts/test-job-review-shortcut.mjs
          node --experimental-sqlite scripts/test-review-closeout-metadata.mjs
      - name: Verify paid-job review action center on synthetic SQLite
        run: node --experimental-sqlite scripts/test-payment-closeout-actions.mjs
      - name: Verify owner-only review snoozes on synthetic paid jobs
        run: |
          node --experimental-sqlite scripts/test-paid-review-snooze.mjs
          node --experimental-sqlite scripts/test-job-closeout-history.mjs
          node scripts/test-loader-recovery.mjs --view PaymentsView --races-only
      - name: Verify completed-job review-status checks, snooze retry and expiry
        run: node --experimental-sqlite scripts/test-review-status-check-snooze.mjs
      - name: Verify Dashboard paid-in-full review attention and exact customer navigation
        run: node scripts/test-dashboard-paid-review-attention.mjs
      - name: Verify review message preparation requires settled job payments
        run: node --experimental-sqlite scripts/test-review-message-eligibility.mjs
      - name: Verify review-sent flags require confirmed owner message receipts
        run: node --experimental-sqlite scripts/test-review-sent-proof.mjs
      - name: Verify invoice loading and payment refresh recover without stale payment controls
