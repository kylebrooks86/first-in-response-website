name: FIRE Gate8 Overpayment Exact Cents and Atomic Readback (OFFLINE)
on:
  pull_request:
    paths:
      - 'business-app-parity/shared/app/api/notifications/route.ts'
      - 'business-app-parity/shared/app/dashboard.tsx'
      - 'business-app-parity/shared/scripts/test-overpayment-reconciliation-sqlite.mjs'
      - '.github/workflows/fire-gate8-overpayment-exact-cents-atomic.yml'
permissions:
  contents: read
jobs:
  owner-overpayment-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline app dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Compile existing owner app and routes
        run: pnpm exec tsc --noEmit --incremental false
      - name: Exercise actual owner overpayment PATCH and native SQLite rollback
        run: node --experimental-sqlite scripts/test-overpayment-reconciliation-sqlite.mjs
      - name: Existing exact amount payment and refund regression
        run: node scripts/test-exact-money-input.mjs
      - name: Existing notifications owner and persistence regression
        run: node --experimental-sqlite scripts/test-notification-mark-all-sqlite.mjs
