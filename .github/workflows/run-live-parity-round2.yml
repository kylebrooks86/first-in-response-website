name: Run live parity round 2

on:
  push:
    paths:
      - 'patch-live-parity-round2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live parity patch
        run: python patch-live-parity-round2.py
      - name: Commit parity updates
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No homepage parity changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match live footer and owner content'
          git push
