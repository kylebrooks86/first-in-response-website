name: FIRE chat business save recovery validation
on:
  push:
    branches: [chat/fire-business-write-validation-2026-10-19]
permissions:
  contents: read
jobs:
  verify-business-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable project pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Shared TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Actual BusinessView task and expense write recovery
        run: node scripts/test-business-write-recovery.mjs
      - name: Existing customer write and invoice regression
        run: |
          node scripts/test-customer-write-recovery.mjs
          node scripts/test-estimate-editor-save-recovery.mjs
