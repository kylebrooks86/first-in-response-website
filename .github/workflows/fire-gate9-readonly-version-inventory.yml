name: FIRE Gate 9 read-only inactive version inventory tests
on:
  pull_request:
    paths:
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_inactive_versions_read_only.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_inactive_versions_read_only.test.mjs'
      - '.github/workflows/fire-gate9-readonly-version-inventory.yml'
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure offline version-classifier tests
        run: node --test business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_inactive_versions_read_only.test.mjs
