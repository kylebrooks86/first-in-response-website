name: FIRE Gate 9 offline provider-contract tests
on:
  pull_request:
    paths:
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_inactive_versions_read_only.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_inactive_versions_read_only.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_fullapp_contract.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_fullapp_contract.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_manifest.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_manifest.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_server_modules.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_server_modules.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_version_envelope.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_session.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_session.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_version_envelope.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_upload_flow.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_upload_flow.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_cloudflare_readonly_adapter.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_cloudflare_readonly_adapter.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_cloudflare_guarded_transport.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_cloudflare_guarded_transport.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_compiled_candidate.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_compiled_candidate.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_pinned_private_target.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_pinned_private_target.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_private_readonly.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_private_readonly.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_private_inactive_upload.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_private_inactive_upload.test.mjs'
      - '.github/workflows/fire-gate9-readonly-version-inventory.yml'
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provider contract without network or secrets
        run: |
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_inactive_versions_read_only.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_fullapp_contract.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_manifest.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_server_modules.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_version_envelope.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_session.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_upload_flow.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_cloudflare_readonly_adapter.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_cloudflare_guarded_transport.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_compiled_candidate.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/gate9_pinned_private_target.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_private_readonly.test.mjs
          node --test business-app-parity/cloudflare-launch/stripe-test-worker/owner_gate9_private_inactive_upload.test.mjs
