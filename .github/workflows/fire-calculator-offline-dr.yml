name: FIRE Calculator Offline DR Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - fire-calculator-exact-live-clone
    paths:
      - 'calculator/index.html'
      - 'calculator/manifest.webmanifest'
      - 'calculator/*.js'
      - 'calculator/*.css'
      - 'calculator/sw.js'
      - 'calculator/tests/offline-dr-acceptance.mjs'
      - '.github/workflows/fire-calculator-offline-dr.yml'

concurrency:
  group: fire-calculator-offline-dr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-dr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fire-playwright-${{ runner.os }}-1.55.0-chromium

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Start staging server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fire-calculator-server.log 2>&1 &
          echo $! > /tmp/fire-calculator-server.pid
          mkdir -p calculator/visual-parity
          sleep 2
          curl --fail http://127.0.0.1:4173/calculator/ >/dev/null

      - name: Verify airplane-mode DR operation
        env:
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_VISUAL_OUT: calculator/visual-parity
        run: node calculator/tests/offline-dr-acceptance.mjs

      - name: Upload offline acceptance report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fire-calculator-offline-dr-acceptance
          path: calculator/visual-parity/offline-dr-acceptance.json
          if-no-files-found: warn
          retention-days: 14
