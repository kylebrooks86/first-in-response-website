name: FIRE Numbered Core v2 Recovery Integrity (Source Only)
on:
  push:
    branches: [work/fire-mobile-contact-consolidation-2026-10-31]
    paths:
      - 'business-app-parity/shared/lib/numbered-records-v2-preflight.mjs'
      - 'business-app-parity/shared/scripts/test-numbered-records-v2-preflight.mjs'
      - 'business-app-parity/shared/lib/numbered-identity-archive.mjs'
      - 'business-app-parity/shared/lib/records-backup-integrity.mjs'
      - '.github/workflows/fire-numbered-core-recovery-v2-preflight.yml'
  pull_request:
    paths:
      - 'business-app-parity/shared/lib/numbered-records-v2-preflight.mjs'
      - 'business-app-parity/shared/scripts/test-numbered-records-v2-preflight.mjs'
      - 'business-app-parity/shared/lib/numbered-identity-archive.mjs'
      - 'business-app-parity/shared/lib/records-backup-integrity.mjs'
      - '.github/workflows/fire-numbered-core-recovery-v2-preflight.yml'
permissions:
  contents: read
jobs:
  validate-source-only:
    name: No-provider numbered core v2/refunds/collisions SQLite safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No external dependencies required
        run: node --version
      - name: Test candidate v2 numbered records and 20 ordinary core tables
        run: node --experimental-sqlite scripts/test-numbered-records-v2-preflight.mjs
