name: FIRE Booking Preview Mobile Regression (isolated)
on:
  push:
    branches:
      - work/fire-permanent-customer-numbers-history-2026-10-31
    paths:
      - 'business-app-parity/shared/components/booking-amendment-preview.tsx'
      - 'business-app-parity/shared/components/booking-review-draft-panel.tsx'
      - 'business-app-parity/shared/scripts/test-post-estimate-booking-preview-browser.mjs'
      - '.github/workflows/fire-booking-preview-mobile-checks.yml'
  pull_request:
    paths:
      - 'business-app-parity/shared/components/booking-amendment-preview.tsx'
      - 'business-app-parity/shared/components/booking-review-draft-panel.tsx'
      - 'business-app-parity/shared/scripts/test-post-estimate-booking-preview-browser.mjs'
      - '.github/workflows/fire-booking-preview-mobile-checks.yml'
permissions:
  contents: read
concurrency:
  group: fire-booking-preview-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  booking-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: business-app-parity/shared
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install pinned isolated browser driver
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Use preinstalled runner Chrome only
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Actual booking-amendment preview 320/390/768, light/dark, owner review and no quote writes
        run: node --experimental-sqlite scripts/test-post-estimate-booking-preview-browser.mjs
