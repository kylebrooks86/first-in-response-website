name: FIRE Schedule owner refresh and read-only mobile recovery (isolated)

on:
  push:
    branches:
      - ci/fire-schedule-refresh-2026-10-20

permissions:
  contents: read

jobs:
  schedule-refresh:
    name: Schedule GET recovery, mobile Chrome and full shared build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Checkout exact candidate read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript and actual Schedule load/refresh handlers
        run: |
          pnpm exec tsc --noEmit
          TZ=America/Chicago node scripts/test-schedule-load-errors.mjs
          node scripts/test-customer-write-recovery.mjs
          node scripts/test-customer-load-recovery.mjs
      - name: Isolated pinned browser driver
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Real customer and schedule browser interactions, synthetic data only
        env:
          FIRE_CONNECTED_UI_SCREENSHOT_DIR: ${{ runner.temp }}/fire-schedule-ui
        run: node scripts/test-connected-records-browser.mjs
      - name: Save owner mobile synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-schedule-refresh-mobile
          path: ${{ runner.temp }}/fire-schedule-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Full shared build without deployment
        run: pnpm run build
