name: Apply live-site visual match

on:
  push:
    paths:
      - '.github/workflows/apply-live-visual-match.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live visual system
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text()

          # Replace the original compact header markup with a desktop nav matching the live site.
          old_header = '''<header class="top"><div class="nav"><a class="brand" href="#"><img src="assets/logo.jpg" alt="FIRE logo"><div><div class="brand-name">FIRST IN RESPONSE</div><div class="brand-sub">EXTERIORS</div></div></a><div class="menu" id="menu-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation menu"><div class="burger">☰</div><small>MENU</small></div></div><nav class="site-menu" id="site-menu" aria-label="Main navigation"><a href="#services">Services</a><a href="#estimate">Instant estimate</a><a href="#results">Real results</a><a href="#on-the-job">On the Job</a><a href="#reviews">Reviews</a><a href="#personal">Personalized estimate</a><a href="review/">Leave a review</a></nav></header>'''
          new_header = '''<header class="top"><div class="nav"><a class="brand" href="#"><img src="assets/logo.jpg" alt="FIRE logo"><div><div class="brand-name">FIRST IN RESPONSE</div><div class="brand-sub">EXTERIORS</div></div></a><nav class="desktop-nav" aria-label="Desktop navigation"><a href="#services">Services</a><a href="#estimate">Instant Estimate</a><a href="#results">Results</a><a href="#on-the-job">Recent Work</a><a href="#reviews">Reviews</a></nav><a class="header-call" href="tel:+19189229366">Call (918) 922-9366</a><div class="menu" id="menu-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation menu"><div class="burger">☰</div><small>MENU</small></div></div><nav class="site-menu" id="site-menu" aria-label="Main navigation"><a href="#services">Services</a><a href="#estimate">Instant estimate</a><a href="#results">Real results</a><a href="#on-the-job">Recent Work</a><a href="#reviews">Reviews</a><a href="#personal">Personalized estimate</a><a href="review/">Leave a review</a></nav></header>'''
          if old_header in html:
              html = html.replace(old_header, new_header, 1)

          # Refine hero line breaks to mirror the live headline composition.
          old_hero_h1 = '''<h1 class="display">Tulsa exterior<br>cleaning with a<br><span class="red">first-responder<br>standard.</span></h1>'''
          new_hero_h1 = '''<h1 class="display">Tulsa exterior<br>cleaning<br><span class="hero-white">with a first-</span><br><span class="red">responder standard.</span></h1>'''
          if old_hero_h1 in html:
              html = html.replace(old_hero_h1, new_hero_h1, 1)

          # Match the mobile CTA wording/order from the live site.
          old_bottom = '''<div class="bottom"><a href="tel:+19189229366">Call</a><a id="bottom-text-photos" href="sms:+19189229366">Text photos</a><a href="#estimate">Estimate</a></div>'''
          new_bottom = '''<div class="bottom"><a class="bottom-estimate" href="#personal">Request an estimate</a><a href="tel:+19189229366">Call Kyle</a><a id="bottom-text-photos" href="sms:+19189229366">Text Kyle</a></div>'''
          if old_bottom in html:
              html = html.replace(old_bottom, new_bottom, 1)

          marker = '<style id="live-site-visual-match">'
          if marker not in html:
              overrides = r'''
<style id="live-site-visual-match">
:root{--red:#e62e2e;--radius:4px;--live-black:#000;--live-dark:#0b0d10;--live-text:#080a0d;--live-muted:#66707b}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--live-text)}
.top{height:calc(68px + env(safe-area-inset-top));background:#000;border-bottom:1px solid rgba(255,255,255,.12)}
.nav{height:68px;max-width:1220px;padding:7px 20px;gap:20px}
.brand{gap:10px;flex:0 0 auto}.brand img{width:54px;height:54px;object-fit:contain;background:transparent}.brand-name{font-size:13px;letter-spacing:.055em}.brand-sub{font-size:9px;letter-spacing:.18em;margin-top:2px}
.desktop-nav{display:none;align-items:center;gap:24px;margin-left:auto}.desktop-nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}.desktop-nav a:hover{color:#ff5a5a}
.header-call{display:none;background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:10px 16px;border-radius:var(--radius);white-space:nowrap}
.menu{margin-left:auto}.site-menu{top:calc(68px + env(safe-area-inset-top))}
.hero{min-height:725px;padding:76px 26px 56px;background:linear-gradient(90deg,rgba(0,0,0,.84) 0%,rgba(0,0,0,.64) 46%,rgba(0,0,0,.22) 74%,rgba(0,0,0,.12) 100%),url('assets/firetruck-hero.png') center/cover no-repeat;color:#fff}.hero:after{display:none}.hero-inner,.eyebrow-row,.checks{max-width:1180px}.hero-inner{margin-top:30px}.eyebrow-row{justify-content:flex-start}.badge{padding:10px 14px;border-radius:var(--radius);font-size:13px;line-height:1.12;letter-spacing:.08em}.dash{display:none}.eyebrow-white{font-size:13px;line-height:1.35;letter-spacing:.1em;color:#c8cdd4}.display{max-width:900px;font-size:clamp(46px,6vw,75px);font-weight:700;line-height:1;letter-spacing:-.035em}.display .hero-white{color:#fff}.display .red{color:var(--red)}.lead{font-size:17px;line-height:1.6;max-width:720px;margin:28px 0 30px;color:#eef0f2}.hero-buttons{display:flex;flex-wrap:wrap;gap:14px}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:72px;padding:16px 32px;border-radius:var(--radius);font-size:17px;border:1px solid rgba(255,255,255,.18);width:auto}.hero-buttons .cta.red{min-width:330px}.hero-buttons .cta.dark{min-width:275px;background:#2f2f2f}.checks{font-size:14px;margin-top:24px;gap:18px;color:#e7e9ec}
.band{background:#101214;color:#fff;padding:18px 20px;border-top:2px solid var(--red);border-bottom:1px solid #222}.band strong{font-size:14px;letter-spacing:.18em}.band p{font-size:14px;margin:7px 0 0;color:#b8bec5}
.section{padding:64px 24px}.max{max-width:1180px}.section h2{font-size:clamp(34px,4.8vw,54px);font-weight:700;line-height:1.02;letter-spacing:-.035em;margin-bottom:22px}.kicker{font-size:12px;letter-spacing:.2em;margin-bottom:14px}.intro{font-size:17px;line-height:1.65;color:var(--live-muted);max-width:880px}.cream{background:#fff}.bluebg{background:#f1f4f7}.dark{background:#0b0d10}
.proof-grid{gap:24px;margin-top:30px}.proof-card,.choice,.review,.service,.formbox,.notice,.est-result,.acc,.faq details{border-radius:var(--radius)}.proof-card{overflow:hidden;border:1px solid #e2e4e7;box-shadow:0 2px 10px rgba(0,0,0,.06)}.beforeafter{height:430px}.beforeafter .slider{width:62px;height:62px;font-size:22px}.beforeafter .label{padding:9px 12px;font-size:11px}.proof-caption{padding:18px}.proof-caption b{font-size:18px}.proof-caption small{font-size:11px;margin-top:8px}.learn{font-size:15px;margin-top:14px}.job-video{position:relative;overflow:hidden;border-radius:var(--radius);background:#000}.job-video video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.media-title{left:18px;bottom:16px}.media-title strong{font-size:16px;margin-top:0;text-shadow:0 2px 10px #000}
.choice-grid{gap:20px;margin-top:32px}.choice{padding:28px;border-top:4px solid var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.04)}.choice h3{font-size:24px;margin:28px 0 12px}.choice p{font-size:16px;line-height:1.6}.num{font-size:14px}
.estimate-wrap{padding:64px 24px;background:#0b0d10}.estimate-wrap .max{max-width:980px}.estimate-wrap h2{font-size:clamp(36px,5vw,56px);font-weight:700;line-height:1.02;margin:12px 0 20px}.notice{border-left:4px solid var(--blue);padding:18px 20px;font-size:16px}.live{top:calc(68px + env(safe-area-inset-top));margin:20px 0;padding:16px 18px;border-left:5px solid var(--red);border-radius:var(--radius)}.live strong{font-size:34px}.acc{margin:12px 0;overflow:hidden}.acc-head{padding:18px 20px}.acc-head h3{font-size:21px}.acc-head p{font-size:14px;line-height:1.5;margin:.45em 0 0}.x{font-size:26px}.opt{padding:18px 20px;grid-template-columns:32px 1fr;gap:13px}.opt b{font-size:16px}.opt p{font-size:14px;line-height:1.55;margin-top:6px}.service-check{width:24px;height:24px}.qty-wrap input{padding:12px;font-size:16px}.est-result{padding:28px;border-top:5px solid var(--red)}.est-result .big{font-size:48px}.discount{padding:18px;grid-template-columns:32px 1fr}.formbox{padding:28px}.field{margin-bottom:18px}.field label{font-size:15px;margin-bottom:7px}.field input,.field textarea,.field select{padding:14px;font-size:16px;border-radius:var(--radius)}.field textarea{min-height:120px}.submit{padding:17px;font-size:17px;border-radius:var(--radius)}
.services{margin-top:34px;border:0;gap:18px}.service{padding:28px;border:1px solid #e0e3e6;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04)}.service:nth-child(even){background:#fff}.service h3{font-size:24px;margin:22px 0 10px}.service p{font-size:15px;line-height:1.6}.bundle{padding:30px;border-left:5px solid var(--red);margin-top:30px;border-radius:var(--radius)}.bundle h3{font-size:25px;margin:18px 0 10px}.bundle p{font-size:16px}
.reviews{gap:18px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.review{min-width:min(380px,86vw);padding:26px;border-top:4px solid var(--red);scroll-snap-align:start;box-shadow:0 2px 10px rgba(0,0,0,.05)}.review p{font-size:16px;line-height:1.65}.review .stars,.stars{font-size:24px}.quote{font-size:38px}.review b{font-size:16px}.review small{font-size:13px}.owner-photo{height:560px}.owner-photo:after{font-size:20px;bottom:30px}.features{grid-template-columns:repeat(3,1fr);gap:20px}.feature{padding:22px 0}.feature b{font-size:18px}.feature p{font-size:15px}.bullets{font-size:16px;line-height:1.9}.faq{gap:10px;margin-top:28px}.faq details{padding:18px 20px}.faq summary{font-size:16px}.faq p{font-size:15px}
footer{padding:54px 28px 90px;background:#050607}.footer-logo{width:110px;margin-bottom:18px}.footer-center strong{font-size:20px}.footer-center p,.footer-cols p{font-size:14px}.footer-cols{margin-top:34px}.footer-cols h3{font-size:17px}
.bottom{height:calc(64px + env(safe-area-inset-bottom));grid-template-columns:1.4fr 1fr 1fr;background:#111}.bottom a{font-size:12px;text-transform:uppercase;letter-spacing:.03em}.bottom .bottom-estimate{background:var(--red)}.bottom a:last-child{background:#181b20}
@media(min-width:980px){.desktop-nav{display:flex}.header-call{display:inline-flex}.menu{display:none}.site-menu{display:none}.nav{height:68px}.bottom{display:none}body{padding-bottom:0}.services{display:grid;grid-template-columns:repeat(2,1fr)}.choice-grid{grid-template-columns:repeat(2,1fr)}.proof-grid{grid-template-columns:repeat(2,1fr)}.reviews{display:flex}.footer-cols{display:grid;grid-template-columns:1fr 1fr;gap:50px}}
@media(max-width:979px){.top{height:calc(68px + env(safe-area-inset-top))}.nav{height:68px}.hero{min-height:660px;padding:48px 20px 42px;background-position:60% center}.display{font-size:clamp(40px,12vw,60px)}.lead{font-size:16px}.hero-buttons{display:grid}.hero-buttons .cta.red,.hero-buttons .cta.dark{min-width:0;width:100%;min-height:58px}.section{padding:52px 18px}.beforeafter{height:390px}.features{grid-template-columns:1fr}.owner-photo{height:500px}}
@media(max-width:600px){.brand-name{font-size:12px}.brand-sub{font-size:8px}.hero{min-height:620px;background-position:64% center}.badge{font-size:11px}.eyebrow-white{font-size:11px}.display{font-size:clamp(38px,12.5vw,52px)}.section h2{font-size:34px}.proof-grid{grid-template-columns:1fr}.beforeafter{height:360px}.estimate-wrap{padding:48px 14px}.estimate-wrap h2{font-size:38px}.live{padding:13px 14px}.live strong{font-size:28px}.acc-head{padding:16px}.acc-head h3{font-size:18px}.opt{padding:16px 14px}.est-result{padding:22px 16px}.est-result .big{font-size:40px}.owner-photo{height:440px}.reviews{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}}
</style>
'''
              html = html.replace('</head>', overrides + '</head>', 1)

          p.write_text(html)
      - name: Commit homepage visual match
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No visual changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match recovery homepage to live visual system'
          git push
