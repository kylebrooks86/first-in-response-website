name: FIRE customer request safety (non-deploying)

on:
  push:
    branches:
      - ci/fire-customer-invalid-json-2026-10-20

permissions:
  contents: read

jobs:
  customer-request:
    name: Real SQLite customer API, idempotency, UI and shared build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Actual customer route idempotency and malformed requests
        run: node --experimental-sqlite scripts/test-customer-create-retry.mjs
      - name: UI customer saves and recovery
        run: |
          node scripts/test-customer-write-recovery.mjs
          node scripts/test-customer-load-recovery.mjs
          node scripts/test-business-list-recovery.mjs
      - name: Finances and owner authorization regressions
        run: |
          node --experimental-sqlite scripts/test-customer-invoice-balances.mjs
          node --experimental-sqlite scripts/test-business-idempotent-routes.mjs
      - name: Build full shared candidate without deployment
        run: pnpm run build
