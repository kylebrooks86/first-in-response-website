name: FIRE NEW LIVE physically D1-bound dark prehost (SOURCE ONLY)
on:
  pull_request:
    paths:
      - 'business-app-parity/prepare_new_live_bound_dark_worker.mjs'
      - 'business-app-parity/test_new_live_bound_dark_worker.mjs'
      - '.github/workflows/fire-new-live-bound-dark-prehost.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: fire-new-live-dark-prehost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-source-only:
    name: Source SHA seal, 242 real original files, LIVE D1 DARK source only (NO PROVIDER)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Checkout reviewed app source, no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ONLY newly changed source and test syntax
        run: |
          node --check business-app-parity/prepare_new_live_bound_dark_worker.mjs
          node --check business-app-parity/test_new_live_bound_dark_worker.mjs
      - name: Read original previously successful NEW LIVE ZIP and verify exact SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_ARTIFACT: '14101058770'
          ORIGINAL_ZIP_SHA256: '7c701cc6401e3eba06f684db2dd5a770b4c137401224ef8aeb812d18faabaec3'
        run: |
          mkdir -p "$RUNNER_TEMP/fire-new-live-original-verified"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL_ARTIFACT/zip" \
            --output "$RUNNER_TEMP/fire-new-live-original.zip"
          echo "$ORIGINAL_ZIP_SHA256  $RUNNER_TEMP/fire-new-live-original.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/fire-new-live-original.zip" \
            -d "$RUNNER_TEMP/fire-new-live-original-verified"
      - name: Run ONLY new physical-D1/source-archive regression and prepare separate output
        run: |
          node business-app-parity/test_new_live_bound_dark_worker.mjs \
            "$RUNNER_TEMP/fire-new-live-original-verified"
          node business-app-parity/prepare_new_live_bound_dark_worker.mjs \
            "$RUNNER_TEMP/fire-new-live-original-verified" \
            "$RUNNER_TEMP/fire-new-live-bound-dark-prehost"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const out=process.env.RUNNER_TEMP+'/fire-new-live-bound-dark-prehost';
          const c=JSON.parse(readFileSync(out+'/server/wrangler.json'));
          const p=JSON.parse(readFileSync(out+'/new-live-physical-dark-prehost-receipt.json'));
          assert.equal(c.name,'fire-fullapp-new-live');
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.equal(c.assets,undefined);
          assert.deepEqual(c.r2_buckets,[]);
          assert.equal(c.d1_databases[0].database_id,'0f4d1c4a-9fbb-4b3d-85c1-2f43f82a3662');
          assert.equal(c.vars.FIRE_NEW_LIVE_AUTH_ENABLED,'blocked');
          assert.equal(c.vars.FIRE_PHOTO_STORAGE_MODE,'owner-device-zip');
          assert.equal(p.newLive26MigrationsPhysicallyVerified,false);
          assert.equal(p.firstJob0001CleanStartPhysicallyVerified,false);
          assert.equal(p.firstCloudflareWorkerCreationAuthorized,false);
          assert.equal(p.workerDeployed,false);
          console.log('PASS original 242 file/new LIVE D1 source; 0 provider calls, 0 migrations, 0 deployment.');
          NODE
      - name: Verify modern Wrangler package OFFLINE only, never create a live version
        run: |
          npm install --prefix "$RUNNER_TEMP/fire-modern-wrangler" --no-save \
            --ignore-scripts --no-audit --no-fund wrangler@4.162.0
          node "$RUNNER_TEMP/fire-modern-wrangler/node_modules/wrangler/bin/wrangler.js" deploy \
            --dry-run --no-bundle \
            --config "$RUNNER_TEMP/fire-new-live-bound-dark-prehost/server/wrangler.json" \
            --outdir "$RUNNER_TEMP/fire-new-live-offline-wrangler-ONLY"
          echo 'NO provider contact, LIVE D1 migration, auth, Stripe, paid services, Worker creation or release.'
      - name: Retain immutable source-only candidate, NEVER a deployment
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-NEW-LIVE-EXISTING-D1-DARK-PREHOST-NEVER-DEPLOY-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/fire-new-live-bound-dark-prehost
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
