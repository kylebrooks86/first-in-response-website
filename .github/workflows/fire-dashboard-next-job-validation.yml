name: FIRE Dashboard next-job mobile quick action (non-deploying)

on:
  push:
    branches:
      - ci/fire-dashboard-next-job-card-2026-10-20

permissions:
  contents: read

jobs:
  dashboard-next-job:
    name: Actual next-job card, mobile focus and full shared build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen dependencies
        run: |
          corepack enable && corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript and source safeguards
        run: |
          pnpm exec tsc --noEmit
          TZ=America/Chicago node scripts/test-schedule-load-errors.mjs
          node scripts/test-customer-load-recovery.mjs
      - name: Pin isolated Playwright, use existing Chrome
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Next job and Schedule mobile browser, synthetic only
        env:
          FIRE_CONNECTED_UI_SCREENSHOT_DIR: ${{ runner.temp }}/fire-dashboard-next
        run: node scripts/test-connected-records-browser.mjs
      - name: Archive synthetic dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-dashboard-next-job-phone
          path: ${{ runner.temp }}/fire-dashboard-next/
          if-no-files-found: ignore
          retention-days: 7
      - name: Full shared build, no publishing
        run: pnpm run build
