name: FIRE New Estimate Mobile Regression (isolated)
on:
  push:
    branches:
      - work/fire-permanent-customer-numbers-history-2026-10-31
    paths:
      - 'business-app-parity/shared/app/dashboard.tsx'
      - 'business-app-parity/shared/scripts/test-reuse-estimate-editor-browser.mjs'
      - 'business-app-parity/cloudflare-launch/FIRE_PRODUCTION_GATE_LOCK_20261102.json'
      - 'business-app-parity/cloudflare-launch/release-gate-lock.test.mjs'
      - '.github/workflows/fire-new-estimate-mobile-checks.yml'
  pull_request:
    paths:
      - 'business-app-parity/shared/app/dashboard.tsx'
      - 'business-app-parity/shared/scripts/test-reuse-estimate-editor-browser.mjs'
      - 'business-app-parity/cloudflare-launch/FIRE_PRODUCTION_GATE_LOCK_20261102.json'
      - 'business-app-parity/cloudflare-launch/release-gate-lock.test.mjs'
      - '.github/workflows/fire-new-estimate-mobile-checks.yml'
permissions:
  contents: read
concurrency:
  group: fire-new-estimate-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: business-app-parity/shared
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install pinned isolated browser driver
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Use preinstalled runner Chrome only
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Regress real New Estimate manual services, 50 QuoteIQ rates, mobile CSS, and no duplicate saves
        run: node scripts/test-reuse-estimate-editor-browser.mjs
      - name: Verify owner-only Void and signed-customer payment instructions (source contract)
        run: node ../cloudflare-launch/stripe-test-worker/estimate-void-contract.test.mjs
      - name: Rehearse exact Void SQL in isolated in-memory SQLite, no provider writes
        run: python3 ../cloudflare-launch/stripe-test-worker/estimate-void-sql-rehearsal.py
      - name: Verify public quote approval and change-request POST guard together
        run: node ../cloudflare-launch/customer-write-guard.test.mjs
      - name: Release gate lock — production remains NO-GO without provider proof
        run: node ../cloudflare-launch/release-gate-lock.test.mjs
