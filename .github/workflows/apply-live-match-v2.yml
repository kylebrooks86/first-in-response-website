name: Apply live match v2

on:
  push:
    paths:
      - '.github/workflows/apply-live-match-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire live-match assets into homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = '<link rel="stylesheet" href="assets/live-match-v2.css">'
          js = '<script src="assets/live-match-v2.js"></script>'
          if css not in s:
              s = s.replace('</head>', css + '</head>', 1)
          if js not in s:
              s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s)
      - name: Commit homepage wiring
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire second-pass live visual match'
          git push
