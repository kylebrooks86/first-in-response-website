name: FIRE Gate 9 full-app LOCAL build, never deploy
on:
  pull_request:
    paths:
      - 'business-app-parity/cloudflare-launch/materialize-stripe-test.py'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_manifest.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9_inactive_fullapp_contract.mjs'
      - '.github/workflows/fire-gate9-fullapp-offline-build.yml'
permissions:
  contents: read
jobs:
  fullapp-local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source only without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated TEST full-app source outside repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/FIRE-GATE9-SYNTHETIC-LOCAL"
          python3 business-app-parity/cloudflare-launch/materialize-stripe-test.py "$RUNNER_TEMP/FIRE-GATE9-SYNTHETIC-LOCAL"
      - name: Typecheck and build with Stripe-disabled TEST code, no secrets
        working-directory: ${{ runner.temp }}/FIRE-GATE9-SYNTHETIC-LOCAL
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec tsc --noEmit --incremental false
          corepack pnpm run build 2>&1 | tee "$RUNNER_TEMP/FIRE-GATE9-COMPILED-ROUTES.log"
      - name: Require full compiled route matrix, no runtime or provider calls
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP'],'FIRE-GATE9-COMPILED-ROUTES.log').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          routes=set(re.findall(r'[^\n]*?[┌├└]\s*[λƒ]\s+(/[^\s]+)',text))
          required={
            '/', '/api/customers', '/api/estimates', '/api/invoices',
            '/api/payments/checkout', '/api/payments/checkout/reconcile',
            '/api/payments/connection', '/api/payments/refund',
            '/api/payments/webhook', '/api/public/estimates/:token/revised-accept',
            '/api/notifications', '/api/followups', '/api/backup',
            '/estimate/:token', '/invoice/:token', '/pay/:id'
          }
          missing=sorted(required-routes)
          print('PARSED_COMPILED_ROUTE_COUNT='+str(len(routes)))
          print('MISSING_REQUIRED_COMPILED_ROUTES='+repr(missing))
          assert not missing and len(routes)>=65, 'STOP: compiled TEST route matrix missing expected full-app routes'
          print('PASS: Full TEST compiled route matrix; required UI/Checkout/refund/webhook routes found; no provider calls')
          print('COMPILED_ROUTE_COUNT='+str(len(routes)))
          PY
      - name: Show only names of hidden SYNTHETIC build artifacts, never file contents
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"FIRE-GATE9-SYNTHETIC-LOCAL"/"dist"/"client"
          names=[str(p.relative_to(root)) for p in root.rglob("*") if p.name.startswith(".")]
          assert len(names)<30, "Unexpected many hidden build artifacts"
          print("SYNTHETIC_COMPILED_DOT_ENTRY_NAMES="+repr(sorted(names)))
          from collections import Counter
          ext=Counter(p.suffix.lower() for p in root.rglob("*") if p.is_file())
          print("SYNTHETIC_ASSET_EXTENSION_COUNTS="+repr(sorted(ext.items())))
          noext=sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file() and not p.suffix and not p.name.startswith("."))
          assert len(noext)<10, "Too many unexpected extensionless assets"
          print("SYNTHETIC_EXTENSIONLESS_FILE_NAMES="+repr(noext))
          import re
          flagged=sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file() and re.search(r"password|secret|token|private|backup",p.name,re.I))
          assert len(flagged)<20 and all(len(n)<256 for n in flagged), "Too many flagged asset names"
          print("SYNTHETIC_SENSITIVE_WORD_PUBLIC_ASSET_NAMES="+repr(flagged))
          extensionless=[str(p.relative_to(root)) for p in root.rglob("*") if p.is_file() and not p.suffix]
          assert len(extensionless)<10, "Unexpected extensionless compiled files"
          print("SYNTHETIC_EXTENSIONLESS_FILES="+repr(sorted(extensionless)))
          PY
      - name: Offline inspect actual compiled TEST static assets
        shell: bash
        run: |
          set -euo pipefail
          node business-app-parity/cloudflare-launch/stripe-test-worker/gate9_offline_asset_manifest.mjs "$RUNNER_TEMP/FIRE-GATE9-SYNTHETIC-LOCAL/dist/client"
          echo 'SOURCE_BUILD_ONLY=PASS; NO CLOUD PROVIDER OR STRIPE WRITES; NOT APPROVED TO UPLOAD.'
