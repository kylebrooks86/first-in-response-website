# Read-only proof harness; checkout the precise draft PR151 source, not this harness commit.
name: FIRE Owner Account Mobile Polish — Pinned Offline Proof
on:
  push:
    branches:
      - chat/fire-owner-account-polish-proof-2026-11-04
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fire-owner-account-polish-proof
  cancel-in-progress: true
jobs:
  owner-account:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      FIRE_PINNED_SOURCE: 311a224c4ce34cef62bef83e768a8e5a7113fc31
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Checkout exact review source, no persistent credentials
        uses: actions/checkout@v4
        with:
          ref: 311a224c4ce34cef62bef83e768a8e5a7113fc31
          fetch-depth: 0
          persist-credentials: false
      - name: Assert immutable review source
        run: test "$(git rev-parse HEAD)" = "$FIRE_PINNED_SOURCE"
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Check shared source TypeScript
        run: pnpm exec tsc --noEmit
      - name: Assert owner account navigation, links, theme, access and mobile tap target
        run: node scripts/test-owner-account.mjs
      - name: Compile actual owner account, contracts and follow-ups against shared CSS
        run: node scripts/test-followups-account-contracts-browser.mjs --compile-only
      # Business task/expense VM fixture is separate from Owner Account; its
      # current stand-alone test lacks the imported expenseBusinessDay helper.
      # Keep that failure documented independently; this proof only covers Owner Account.
      - name: Confirm no hosting or customer-data action was performed
        run: echo 'Source-only, synthetic/local checks; no deployment, migration, provider call, or data export.'
