name: Run current site verifier migration

on:
  push:
    paths:
      - '.github/workflows/run-current-site-verifier-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current site structure
        run: python patch-current-site-verifier.py
      - name: Commit migration
        run: |
          if git diff --quiet -- index.html verify-site.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html verify-site.mjs
          git commit -m 'Align verifier with current public site structure'
          git push
