name: FIRE Settings Template Save D1 Readback (OFFLINE)
on:
  pull_request:
    paths:
      - 'business-app-parity/shared/app/api/message-templates/route.ts'
      - 'business-app-parity/shared/scripts/test-template-save-d1-confirmed-sqlite.mjs'
      - '.github/workflows/fire-template-save-d1-readback.yml'
permissions:
  contents: read
jobs:
  template-save:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline app dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript-check FIRE owner routes
        run: pnpm exec tsc --noEmit --incremental false
      - name: Confirm actual template PUT/GET via disposable SQLite and fault injection
        run: node --experimental-sqlite scripts/test-template-save-d1-confirmed-sqlite.mjs
      - name: Preserve legacy template wording and owner-only access
        run: node scripts/test-business-template-compatibility.mjs
