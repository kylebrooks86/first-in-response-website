name: FIRE G4 STAGING activation-ready operator offline
on:
  pull_request:
    paths:
      - 'business-app-parity/*activation*ready*'
      - '.github/workflows/fire-g4-staging-activation-ready.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse Windows PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'business-app-parity/owner_staging_activation_ready.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'PowerShell parser failed' }
      - name: Offline synthetic transport and binding tests
        shell: pwsh
        run: |
          node --check business-app-parity/owner_staging_activation_ready.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node business-app-parity/test-staging-activation-ready.mjs
