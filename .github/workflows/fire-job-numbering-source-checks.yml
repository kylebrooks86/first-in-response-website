name: FIRE Job Numbering Source Safety

on:
  push:
    branches:
      - work/fire-quoteiq-style-job-numbers-2026-10-29
    paths:
      - 'business-app-parity/job-numbering/**'
      - 'business-app-parity/test_job_numbering_schema.py'
      - 'business-app-parity/test_job_history_preflight.py'
      - 'business-app-parity/shared/lib/job-numbering.mjs'
      - 'business-app-parity/shared/scripts/test-job-numbering.mjs'
      - '.github/workflows/fire-job-numbering-source-checks.yml'
  pull_request:
    paths:
      - 'business-app-parity/job-numbering/**'
      - 'business-app-parity/test_job_numbering_schema.py'
      - 'business-app-parity/test_job_history_preflight.py'
      - 'business-app-parity/shared/lib/job-numbering.mjs'
      - 'business-app-parity/shared/scripts/test-job-numbering.mjs'
      - '.github/workflows/fire-job-numbering-source-checks.yml'

permissions:
  contents: read

jobs:
  job-number-contract:
    name: Existing FIRE D1 source + safe Job numbering (NO hosted writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review-only source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SQLite jobs, revision, invoice linkage and no-reuse invariants
        run: python -m unittest discover -s business-app-parity -p 'test_job_numbering_schema.py' -v
      - name: Preflight historical quote revisions and completed-job counts
        run: python -m unittest discover -s business-app-parity -p 'test_job_history_preflight.py' -v
      - name: Job labels and database statement contract
        run: node business-app-parity/shared/scripts/test-job-numbering.mjs
      - name: Assert no active migration journal was changed for this prototype
        run: |
          # The only permitted overlay changes in this PR are Home UI source
          # parity for the distinct completed-job count. Migration journals,
          # secrets, bindings and all other adapter files remain forbidden.
          git diff --name-only ${{ github.event.pull_request.base.sha || github.event.before }} HEAD -- business-app-parity/adapters/ | tee /tmp/fire_adapter_changes.txt
          grep -Ev '^business-app-parity/adapters/(live|staging|doomsday|qa|independent-staging)/app/page\.tsx
 /tmp/fire_adapter_changes.txt > /tmp/fire_unapproved_adapter_changes.txt || true
          test ! -s /tmp/fire_unapproved_adapter_changes.txt
