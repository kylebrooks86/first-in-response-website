name: FIRE Schedule completed work by selected day (synthetic)

on:
  push:
    branches:
      - ci/fire-schedule-historical-days-2026-10-20

permissions:
  contents: read

jobs:
  day-history:
    name: View historical jobs without past driving routes or payment changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependency versions
        run: |
          corepack enable && corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript and actual dated Schedule handlers
        run: |
          pnpm exec tsc --noEmit
          TZ=America/Chicago node scripts/test-schedule-load-errors.mjs
          node scripts/test-customer-load-recovery.mjs
      - name: Isolated Chrome browser harness, no downloaded browser
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Actual mobile date browser checks, history and no past routes
        env:
          FIRE_CONNECTED_UI_SCREENSHOT_DIR: ${{ runner.temp }}/fire-schedule-history
        run: node scripts/test-connected-records-browser.mjs
      - name: Synthetic Schedule screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-schedule-history-mobile
          path: ${{ runner.temp }}/fire-schedule-history/
          if-no-files-found: ignore
          retention-days: 7
      - name: Full shared candidate build without deployment
        run: pnpm run build
