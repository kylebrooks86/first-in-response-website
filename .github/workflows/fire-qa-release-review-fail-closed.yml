name: FIRE QA Code Update Read-Only Review Safety
on:
  push:
    branches:
      - work/fire-permanent-customer-numbers-history-2026-10-31
    paths:
      - 'business-app-parity/owner_windows_qa_update_review.ps1'
      - 'business-app-parity/owner_windows_qa_update_publish.ps1'
      - 'business-app-parity/owner_windows_qa_current_readonly.ps1'
      - 'business-app-parity/test_owner_windows_qa_update_review.py'
      - 'business-app-parity/test_owner_windows_qa_update_publish.py'
      - '.github/workflows/fire-qa-release-review-fail-closed.yml'
  pull_request:
    paths:
      - 'business-app-parity/owner_windows_qa_update_review.ps1'
      - 'business-app-parity/owner_windows_qa_update_publish.ps1'
      - 'business-app-parity/owner_windows_qa_current_readonly.ps1'
      - 'business-app-parity/test_owner_windows_qa_update_review.py'
      - 'business-app-parity/test_owner_windows_qa_update_publish.py'
      - '.github/workflows/fire-qa-release-review-fail-closed.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert owner read-only QA review follows observed QA Worker but publish stays locked
        run: python3 -m unittest discover -s business-app-parity -p test_owner_windows_qa_update_review.py -v
      - name: Assert no QA publish without exact candidate, D1 and owner approval
        run: python3 -m unittest discover -s business-app-parity -p test_owner_windows_qa_update_publish.py -v
