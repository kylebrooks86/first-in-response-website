name: FIRE QA Code Update Read-Only Review Safety
on:
  push:
    branches:
      - work/fire-permanent-customer-numbers-history-2026-10-31
    paths:
      - 'business-app-parity/owner_windows_qa_update_review.ps1'
      - 'business-app-parity/owner_windows_qa_update_publish.ps1'
      - 'business-app-parity/owner_windows_qa_backup_current25.ps1'
      - 'business-app-parity/verify_qa_current25_d1_export.py'
      - 'business-app-parity/test_owner_windows_qa_current25_export_pin.py'
      - 'business-app-parity/test_verify_qa_current25_d1_export.py'
      - 'business-app-parity/owner_windows_qa_current_readonly.ps1'
      - 'business-app-parity/owner_windows_build_qa_candidate.ps1'
      - 'business-app-parity/check_qa_runtime_config.mjs'
      - 'business-app-parity/prepare_qa_deploy_config.mjs'
      - 'business-app-parity/test_check_qa_runtime_config.mjs'
      - 'business-app-parity/test_prepare_qa_deploy_config.mjs'
      - 'business-app-parity/test_owner_windows_build_qa_candidate.py'
      - 'business-app-parity/test_owner_windows_qa_update_review.py'
      - 'business-app-parity/qa_d1_identity_from_info.ps1'
      - 'business-app-parity/test_qa_d1_identity_from_info.ps1'
      - 'business-app-parity/test_owner_windows_qa_update_publish.py'
      - '.github/workflows/fire-qa-release-review-fail-closed.yml'
  pull_request:
    paths:
      - 'business-app-parity/owner_windows_qa_update_review.ps1'
      - 'business-app-parity/owner_windows_qa_update_publish.ps1'
      - 'business-app-parity/owner_windows_qa_backup_current25.ps1'
      - 'business-app-parity/verify_qa_current25_d1_export.py'
      - 'business-app-parity/test_owner_windows_qa_current25_export_pin.py'
      - 'business-app-parity/test_verify_qa_current25_d1_export.py'
      - 'business-app-parity/owner_windows_qa_current_readonly.ps1'
      - 'business-app-parity/owner_windows_build_qa_candidate.ps1'
      - 'business-app-parity/check_qa_runtime_config.mjs'
      - 'business-app-parity/prepare_qa_deploy_config.mjs'
      - 'business-app-parity/test_check_qa_runtime_config.mjs'
      - 'business-app-parity/test_prepare_qa_deploy_config.mjs'
      - 'business-app-parity/test_owner_windows_build_qa_candidate.py'
      - 'business-app-parity/test_owner_windows_qa_update_review.py'
      - 'business-app-parity/qa_d1_identity_from_info.ps1'
      - 'business-app-parity/test_qa_d1_identity_from_info.ps1'
      - 'business-app-parity/test_owner_windows_qa_update_publish.py'
      - '.github/workflows/fire-qa-release-review-fail-closed.yml'
concurrency:
  # The latest candidate supersedes previous PR revisions only. Never cancel
  # a main-branch publish, release, or recovery run automatically.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real compiled QA source permits NO R2 subscription, rejects extra buckets
        run: |
          node business-app-parity/test_check_qa_runtime_config.mjs
          node business-app-parity/test_prepare_qa_deploy_config.mjs
      - name: Refuse implicit legacy QA branch or blank source SHA in local candidate builder
        run: python3 -m unittest discover -s business-app-parity -p test_owner_windows_build_qa_candidate.py -v
      - name: Assert owner read-only QA review follows observed QA Worker but publish stays locked
        run: python3 -m unittest discover -s business-app-parity -p test_owner_windows_qa_update_review.py -v
      - name: Assert no QA publish without exact candidate, D1 and owner approval
        run: python3 -m unittest discover -s business-app-parity -p test_owner_windows_qa_update_publish.py -v
      - name: QA current25 backup current-version and dry-run authorization guards (offline)
        run: python3 -m unittest discover -s business-app-parity -p test_owner_windows_qa_current25_export_pin.py -v
      - name: Current QA 25-migration private SQL restore integrity (synthetic in-memory SQLite)
        run: python3 -m unittest discover -s business-app-parity -p test_verify_qa_current25_d1_export.py -v
      - name: Strict dual D1 INFO identity validator and malformed/colliding metadata refusal (offline)
        run: pwsh -NoProfile -File business-app-parity/test_qa_d1_identity_from_info.ps1
      - name: Actual detached and attached Git checkout safety guards (local synthetic only)
        run: pwsh -NoProfile -File business-app-parity/test_qa_detached_worktree_guards.ps1

  qa-current25-backup-default-off:
    name: Windows QA private backup default never exports or accesses Cloudflare
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual Windows PowerShell dry run returns before provider or backup operations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& ./business-app-parity/owner_windows_qa_backup_current25.ps1 6>&1 | Out-String)
          if ($output.Count -ne 1 -or $output[0] -notmatch 'EXPORT_ATTEMPTED=NO; REMOTE_WRITES=NONE; QA_RELEASE_APPROVED=NO') {
            throw 'FIRE QA private backup did not remain inert by default.'
          }
          if ($output[0] -notmatch 'DRY RUN ONLY: no Cloudflare connection') {
            throw 'FIRE QA dry-run boundary is missing.'
          }
          Write-Host 'PASS: current QA25 private backup default OFF on real Windows PowerShell; no export or provider calls.'
