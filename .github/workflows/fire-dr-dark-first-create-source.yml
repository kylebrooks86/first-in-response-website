name: FIRE DR first-create no-public-route candidate (SOURCE ONLY, NO DEPLOY)
on:
  pull_request:
    paths:
      - 'business-app-parity/prepare_dr_dark_first_create_source.mjs'
      - 'business-app-parity/test_dr_dark_first_create_source.mjs'
      - '.github/workflows/fire-dr-dark-first-create-source.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: fire-dr-dark-first-create-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verified-pr268-artifact-dark-first-create:
    name: Actual original PR268 bytes + disabled public URLs + offline Wrangler dry-run ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Review exact source code without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check ONLY changed code
        run: |
          node --check business-app-parity/prepare_dr_dark_first_create_source.mjs
          node --check business-app-parity/test_dr_dark_first_create_source.mjs
      - name: Read ONLY original sealed PR268 source artifact and check actual ZIP hash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '14101977692'
          SHA256: 'ae3f0078b15376ed861d7c0c47e4943f88b700f528e5c65c2e8f5ae9de7761d4'
        run: |
          mkdir -p "$RUNNER_TEMP/fire-dr-physical-prehost-original"
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/pr268-exact-original.zip"
          echo "$SHA256  $RUNNER_TEMP/pr268-exact-original.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/pr268-exact-original.zip" \
            -d "$RUNNER_TEMP/fire-dr-physical-prehost-original"
      - name: Generate separate first-create-only package and test exact unchanged binaries
        run: |
          node business-app-parity/test_dr_dark_first_create_source.mjs \
            "$RUNNER_TEMP/fire-dr-physical-prehost-original"
          node business-app-parity/prepare_dr_dark_first_create_source.mjs \
            "$RUNNER_TEMP/fire-dr-physical-prehost-original" \
            "$RUNNER_TEMP/fire-dr-dark-first-create"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/fire-dr-dark-first-create';
          const cfg=JSON.parse(readFileSync(root+'/server/wrangler.json'));
          const receipt=JSON.parse(readFileSync(root+'/dark-first-create-source-receipt.json'));
          assert.equal(cfg.workers_dev,false);
          assert.equal(cfg.preview_urls,false);
          assert.equal(cfg.assets,undefined);
          assert.equal(cfg.routes,undefined);
          assert.equal(cfg.route,undefined);
          assert.equal(cfg.vars.FIRE_DR_AUTH_ENABLED,'blocked');
          assert.equal(cfg.d1_databases[0].database_id,'5e55c5b7-cd67-4c8f-a52e-40f71b5d3145');
          assert.deepEqual(cfg.r2_buckets,[]);
          assert.equal(receipt.newFirstWorkerCreateAuthorized,false);
          assert.equal(receipt.firstProviderDeployPerformed,false);
          console.log('PASS no public worker route, no version previews, no R2, no auth; first creation NOT performed.');
          NODE
      - name: Check locally against modern Wrangler — dry-run has NO Cloudflare write
        run: |
          npm install --prefix "$RUNNER_TEMP/fire-modern-wrangler" --no-save \
            --ignore-scripts --no-audit --no-fund wrangler@4.162.0
          node "$RUNNER_TEMP/fire-modern-wrangler/node_modules/wrangler/bin/wrangler.js" deploy \
            --dry-run --no-bundle \
            --config "$RUNNER_TEMP/fire-dr-dark-first-create/server/wrangler.json" \
            --outdir "$RUNNER_TEMP/fire-dr-dark-first-create-wrangler-OFFLINE-ONLY"
          echo 'NO live Worker, Cloudflare migration, Stripe action, secrets, deployment or routes changed.'
      - name: Retain separate candidate FOR REVIEW ONLY, NEVER a deploy
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-DR-DARK-FIRST-CREATE-NEVER-DEPLOY-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/fire-dr-dark-first-create
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
