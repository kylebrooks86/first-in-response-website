name: FIRE Gate 9 TEST Webhook Six-Event Contract (Offline Only)

on:
  pull_request:
    paths:
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/webhook-path-contract.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9-provider-webhook-contract.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/webhook-path.test.mjs'
      - 'business-app-parity/cloudflare-launch/stripe-test-worker/gate9-provider-webhook-contract.test.mjs'
      - '.github/workflows/fire-gate9-six-event-contract.yml'

permissions:
  contents: read

jobs:
  exact-test-webhook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Real TEST webhook exact-path and six-event rejection cases
        run: |
          node --test \
            business-app-parity/cloudflare-launch/stripe-test-worker/webhook-path.test.mjs \
            business-app-parity/cloudflare-launch/stripe-test-worker/gate9-provider-webhook-contract.test.mjs
