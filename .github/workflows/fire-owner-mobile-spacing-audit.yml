name: FIRE Owner App Mobile Spacing Audit
on:
  pull_request:
    paths:
      - 'business-app-parity/shared/app/dashboard.tsx'
      - 'business-app-parity/shared/components/global-search.tsx'
      - 'business-app-parity/shared/components/ui/alert-dialog.tsx'
      - 'business-app-parity/shared/scripts/test-section-navigation.mjs'
      - 'business-app-parity/shared/scripts/test-payment-mobile-ui.mjs'
      - 'business-app-parity/shared/app/globals.css'
      - 'business-app-parity/shared/scripts/test-owner-mobile-spacing-audit-browser.mjs'
      - '.github/workflows/fire-owner-mobile-spacing-audit.yml'
  push:
    branches:
      - 'work/fire-mobile-contact-consolidation-2026-10-31'
    paths:
      - 'business-app-parity/shared/app/dashboard.tsx'
      - 'business-app-parity/shared/app/globals.css'
      - 'business-app-parity/shared/scripts/test-owner-mobile-spacing-audit-browser.mjs'
      - '.github/workflows/fire-owner-mobile-spacing-audit.yml'
permissions:
  contents: read
jobs:
  app-wide-owner-spacing:
    name: Compiled CSS iPhone header, notifications and bottom-action reachability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install pinned source dependencies
        working-directory: business-app-parity/shared
        run: pnpm install --frozen-lockfile
      - name: Install isolated pinned browser driver
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Use local Chrome without provider access
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Verify guarded Back, search and notification jumps before mobile visual audit
        working-directory: business-app-parity/shared
        run: node scripts/test-section-navigation.mjs
      - name: Guard manual payment close, uncertain receipts and mobile payment layout
        working-directory: business-app-parity/shared
        run: node scripts/test-payment-mobile-ui.mjs
      - name: Verify 320-667px phone/landscape hit areas from compiled app CSS
        working-directory: business-app-parity/shared
        run: node scripts/test-owner-mobile-spacing-audit-browser.mjs
