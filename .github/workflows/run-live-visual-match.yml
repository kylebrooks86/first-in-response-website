name: Run live visual match

on:
  push:
    paths:
      - '.github/workflows/run-live-visual-match.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply visual patch
        run: python apply-live-visual-match.py
      - name: Commit updated homepage
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No homepage changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match recovery homepage to live visual system'
          git push
