name: Run mobile verifier patch

on:
  push:
    paths:
      - '.github/workflows/run-mobile-verifier-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verifier
        run: python patch-mobile-verifier.py
      - name: Commit verifier update
        run: |
          set -euo pipefail
          if git diff --quiet -- verify-site.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-site.mjs
          git commit -m 'Support relative mobile estimate links'
          git push
