name: FIRE exact expense purchase dates and mobile records (non-deploying)

on:
  push:
    branches:
      - ci/fire-expense-purchase-date-2026-10-20

permissions:
  contents: read

jobs:
  expense-dates:
    name: Actual expense handlers, SQLite, mobile Chrome and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: business-app-parity/shared
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Locked install
        run: pnpm install --frozen-lockfile
      - name: TypeScript, date parser and task deadlines
        run: |
          pnpm exec tsc --noEmit
          node scripts/test-expense-date.mjs
          TZ=America/Chicago node scripts/test-task-due.mjs
      - name: Actual Business POST handlers with stable expense retry receipts
        run: |
          node scripts/test-business-write-recovery.mjs
          node scripts/test-business-restart-recovery.mjs
          node --experimental-sqlite scripts/test-business-idempotent-routes.mjs
          node --experimental-sqlite scripts/test-expense-csv-safety.mjs
      - name: Pinned isolated browser driver, no new Chrome installation
        run: |
          mkdir -p "$RUNNER_TEMP/fire-browser-harness"
          npm --prefix "$RUNNER_TEMP/fire-browser-harness" install --no-save --no-audit --no-fund playwright@1.56.1
          echo "FIRE_BROWSER_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fire-browser-harness/node_modules/playwright" >> "$GITHUB_ENV"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          echo "FIRE_BROWSER_TEST_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Real Business React date field and expense draft preserved across mobile actions
        env:
          FIRE_UI_SCREENSHOT_DIR: ${{ runner.temp }}/fire-expense-ui
        run: node scripts/test-business-records-browser.mjs
      - name: Keep synthetic browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-expense-date-mobile-ui
          path: ${{ runner.temp }}/fire-expense-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Full shared build without publishing
        run: pnpm run build
