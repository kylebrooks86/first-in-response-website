name: FIRE Calculator Parity Gate

on:
  push:
    branches:
      - fire-calculator-exact-live-clone
    paths:
      - 'calculator/**'
      - '.github/workflows/fire-calculator-parity.yml'
  pull_request:
    paths:
      - 'calculator/**'
      - '.github/workflows/fire-calculator-parity.yml'

jobs:
  parity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Formula regression
        run: node calculator/tests/formula-regression.js

      - name: Live-reference contract
        run: node calculator/tests/live-contract.js --manifest calculator/SHARED_CORE_MANIFEST.json

      - name: Offline cache contract
        run: node calculator/tests/offline-cache-contract.mjs

      - name: Shared-core fingerprint
        run: node calculator/tests/verify-shared-core.js calculator
