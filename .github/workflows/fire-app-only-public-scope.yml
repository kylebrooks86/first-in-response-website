name: FIRE App-Only Main Integration — Preserve Public Website and Calculator

on:
  pull_request:
    paths:
      - 'business-app-parity/**'
      - 'fire-app-dr/**'
      - 'dr-parity-evidence/**'
      - 'dr-parity-overlays/**'
      - '.github/workflows/fire-app-only-public-scope.yml'
      - '.github/workflows/fire-staging-offline-rehearsal.yml'
      - '.github/workflows/fire-numbered-core-recovery-v2-preflight.yml'
      - '.github/workflows/fire-numbered-v2-photo-archive-pair.yml'
      - '.github/workflows/fire-gate4-provider-identity-preflight.yml'
      - '.github/workflows/fire-qa-release-review-fail-closed.yml'
      - '.github/workflows/fire-qa-v25-private-backup-offline.yml'
      - '.github/workflows/fire-gate9-fullapp-offline-build.yml'
      - '.github/workflows/fire-gate9-readonly-version-inventory.yml'
      - '.github/workflows/fire-gate7-legacy-sites-offline-export.yml'
      - '.github/workflows/fire-new-independent-release-candidates.yml'
      - '.github/workflows/fire-pin-passkey-access.yml'
      - '.github/workflows/fire-gate7-saved-photo-offline-proof.yml'
      - '.github/workflows/fire-isolated-sqlite-full-recovery.yml'
      - '.github/workflows/fire-dr-private-owner-evidence.yml'
      - '.github/workflows/fire-dr-worker-only-noassetupload.yml'
      - '.github/workflows/fire-new-live-worker-only-noassetupload.yml'
      - '.github/workflows/fire-dr-existing-d1-prehost.yml'
      - '.github/workflows/fire-dr-dark-first-create-source.yml'
      - '.github/workflows/fire-new-live-bound-dark-prehost.yml'
      - '.github/workflows/fire-new-live-one-shot-migration-safety.yml'
      - '.github/workflows/fire-new-live-portable-schema-custody.yml'
      - '.github/workflows/fire-new-live-attempt-readonly-reconciliation.yml'
      - '.github/workflows/fire-existing-dark-code-update-source-only.yml'
      - 'verify-site.mjs'
      - 'verify-site-ci.mjs'
      - 'ci/test-site-verifier-scope.mjs'
      - '.github/workflows/verify-site.yml'

concurrency:
  # The latest candidate supersedes previous PR revisions only. Never cancel
  # a main-branch publish, release, or recovery run automatically.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protect-website-and-calculator:
    name: Compare exact public-site and calculator Git trees to target main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout candidate with source history, without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse any public website, calculator, or unreviewed file changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_BASE_REF:-}" != "main" ]]; then
            echo "BLOCKED: this source-preservation packet only targets main"
            exit 1
          fi
          git fetch --no-tags origin main
          base="origin/main"
          protected=(
            assets calculator index.html services privacy review recent-work
            robots.txt sitemap.xml terms service-terms
            .github/workflows/capture-live-hero.yml
            .github/workflows/capture-recent-work-assets.yml
            .github/workflows/deploy-full-v18-calculator.yml
            .github/workflows/run-live-visual-match.yml
          )
          for path in "${protected[@]}"; do
            expected="$(git rev-parse "${base}:${path}")"
            actual="$(git rev-parse "HEAD:${path}")"
            if [[ "$expected" != "$actual" ]]; then
              echo "BLOCKED: protected website/calculator path differs: $path"
              exit 1
            fi
          done
          # Four exact PR173 verifier blobs and newly reviewed, SHA-pinned offline CI
          # workflow blobs are SHA-pinned exceptions. Five additional filenames below
          # were reviewed and tested in PRs 265-269; no wildcard CI workflow exception.
          # The Gate7 legacy workflow pin below is the exact separately-tested
          # 2026-11-12 immutable blob including private-file negative checks;
          # all other verifier and protected website blobs remain unchanged.
          # Reviewed NEW LIVE SQL-custody workflow now downloads by the exact same-run\n          # upload artifact ID, with read-only Actions permission (not mutable name).\n          # Gate9's former artifact-download race was repaired in an exact-scope
          # read-only same-run 5-attempt retry; update ONLY that workflow blob pin.
          # Real public pages, assets, calculator and unrelated paths remain protected.
          reviewed_paths=(
            verify-site.mjs verify-site-ci.mjs ci/test-site-verifier-scope.mjs
            .github/workflows/verify-site.yml
            .github/workflows/fire-gate9-fullapp-offline-build.yml
            .github/workflows/fire-gate9-readonly-version-inventory.yml
            .github/workflows/fire-gate7-legacy-sites-offline-export.yml
            .github/workflows/fire-gate7-saved-photo-offline-proof.yml
            .github/workflows/fire-isolated-sqlite-full-recovery.yml
            .github/workflows/fire-dr-private-owner-evidence.yml
            .github/workflows/fire-dr-worker-only-noassetupload.yml
            .github/workflows/fire-new-live-worker-only-noassetupload.yml
            .github/workflows/fire-dr-existing-d1-prehost.yml
            .github/workflows/fire-dr-dark-first-create-source.yml
            .github/workflows/fire-new-live-bound-dark-prehost.yml
            .github/workflows/fire-new-live-one-shot-migration-safety.yml
            .github/workflows/fire-new-live-portable-schema-custody.yml
            .github/workflows/fire-new-live-attempt-readonly-reconciliation.yml
            .github/workflows/fire-existing-dark-code-update-source-only.yml
          )
          reviewed_blobs=(
            4042570221cf4f31d2749534775bfd7d349ccfe1
            ccf96985afb7949af8999792708ab4761fa308b3
            5c4c28a43de2d6be5c1e6de0ba0cfd2b4c6e784e
            6c9aab68423963fa85a5b295ce4c1a16f676a7da
            96b4d803080113a94db0c4d32507c3c95f944489
            ef09046e724ed5c7cf747c38325414098144de15
            b290edbc2ae4d2134d5eecb5dc79b04b92235ae8
            39815146129c81a48cdc5631eff4370ae0116a58
            a0f124241be89a0c27df74bf25176c75ec54e09f
            f6676f959cd6a0ff04cc5d0221891a99ca49d535
            991ec354dd836e5f42b10d97984da9fa2c9ff6df
            2c507c8bccadf13a2c6de9c972f2b3536d0dffb2
            9958ac344b76b76dc75e8205285b2bfcdd31b351
            7c3ee946b6cd7a8f30a36776687a9390d6f26632
            6dde5c4a8c226f6967d263a537caa54b22d85a06
            e3e4df3fc0590cdb9d73baf090932031c03b520d
            f27f06cf96945325be2aebb61835e01fe83e1097
            332e5e89404710ee70df684e384978bf58f8959c
            c270cca91494f593d9ea119b95571ce36a476795
          )
          for i in "${!reviewed_paths[@]}"; do
            file="${reviewed_paths[$i]}"
            actual="$(git rev-parse "HEAD:${file}" 2>/dev/null || true)"
            if [[ "$actual" != "${reviewed_blobs[$i]}" ]]; then
              echo "BLOCKED: reviewed verifier or Gate7/Gate9 CI workflow does not match pinned blob: $file"
              exit 1
            fi
          done
          mapfile -t changed < <(git diff --name-only --diff-filter=ACDMRT "${base}...HEAD")
          if (("${#changed[@]}" == 0)); then
            echo "BLOCKED: no app source differences to review"
            exit 1
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              verify-site.mjs|verify-site-ci.mjs|ci/test-site-verifier-scope.mjs|.github/workflows/verify-site.yml|business-app-parity/*|fire-app-dr/*|dr-parity-evidence/*|dr-parity-overlays/*|.github/workflows/fire-app-only-public-scope.yml|.github/workflows/fire-staging-offline-rehearsal.yml|.github/workflows/fire-numbered-core-recovery-v2-preflight.yml|.github/workflows/fire-numbered-v2-photo-archive-pair.yml|.github/workflows/fire-gate4-provider-identity-preflight.yml|.github/workflows/fire-qa-release-review-fail-closed.yml|.github/workflows/fire-qa-v25-private-backup-offline.yml|.github/workflows/fire-gate9-fullapp-offline-build.yml|.github/workflows/fire-gate9-readonly-version-inventory.yml|.github/workflows/fire-gate7-legacy-sites-offline-export.yml|.github/workflows/fire-new-independent-release-candidates.yml|.github/workflows/fire-pin-passkey-access.yml|.github/workflows/fire-gate7-saved-photo-offline-proof.yml|.github/workflows/fire-isolated-sqlite-full-recovery.yml|.github/workflows/fire-dr-private-owner-evidence.yml|.github/workflows/fire-dr-worker-only-noassetupload.yml|.github/workflows/fire-new-live-worker-only-noassetupload.yml|.github/workflows/fire-dr-existing-d1-prehost.yml|.github/workflows/fire-dr-dark-first-create-source.yml|.github/workflows/fire-new-live-bound-dark-prehost.yml|.github/workflows/fire-new-live-one-shot-migration-safety.yml|.github/workflows/fire-new-live-portable-schema-custody.yml|.github/workflows/fire-new-live-attempt-readonly-reconciliation.yml|.github/workflows/fire-existing-dark-code-update-source-only.yml|.github/workflows/fire-owner-dr-launcher-windows.yml|.github/workflows/fire-dr-dark-postcreate-readonly.yml)
                ;;
              *)
                echo "BLOCKED: unreviewed non-app change: $file"
                exit 1
                ;;
            esac
          done
          echo "PASS: public site/calculator match main, and all reviewed verifier/CI workflow blobs are SHA-pinned (including the existing DARK updater)."
          echo "PASS: changed paths limited to app source, approved workflows and four pinned verifier files."
          echo "NO merge, publish, provider authentication or deployment was attempted."
