name: FIRE New Numbered Records v2 Source Contract
on:
  pull_request:
    paths:
      - 'business-app-parity/shared/lib/numbered-records-v2.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-integrity.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-sealed.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-photo-vault.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-sealed-photos.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-private-kit.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-local-review.mjs'
      - 'business-app-parity/shared/app/private-recovery-review/page.tsx'
      - 'business-app-parity/shared/app/private-recovery-review/recovery-preview-client.tsx'
      - 'business-app-parity/shared/lib/numbered-records-v2-d1-read.mjs'
      - 'business-app-parity/shared/scripts/test-numbered-records-v2.mjs'
      - 'business-app-parity/shared/scripts/test-numbered-records-v2-integrity.mjs'
      - 'business-app-parity/restore-lab/restore_numbered_mappings_memory.mjs'
      - 'business-app-parity/restore-lab/restore_complete_numbered_records_memory.mjs'
      - 'business-app-parity/restore-lab/test_restore_numbered_mappings_memory.mjs'
      - 'business-app-parity/restore-lab/test_actual_qa25_numbered_restore.mjs'
      - '.github/workflows/fire-numbered-records-v2-source-contract.yml'
  push:
    branches: [work/fire-numbered-records-v2-source-only-2026-10-31]
    paths:
      - 'business-app-parity/shared/lib/numbered-records-v2.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-integrity.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-sealed.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-photo-vault.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-sealed-photos.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-private-kit.mjs'
      - 'business-app-parity/shared/lib/numbered-records-v2-local-review.mjs'
      - 'business-app-parity/shared/app/private-recovery-review/page.tsx'
      - 'business-app-parity/shared/app/private-recovery-review/recovery-preview-client.tsx'
      - 'business-app-parity/shared/lib/numbered-records-v2-d1-read.mjs'
      - 'business-app-parity/shared/scripts/test-numbered-records-v2.mjs'
      - 'business-app-parity/shared/scripts/test-numbered-records-v2-integrity.mjs'
      - 'business-app-parity/restore-lab/restore_numbered_mappings_memory.mjs'
      - 'business-app-parity/restore-lab/restore_complete_numbered_records_memory.mjs'
      - 'business-app-parity/restore-lab/test_restore_numbered_mappings_memory.mjs'
      - 'business-app-parity/restore-lab/test_actual_qa25_numbered_restore.mjs'
      - '.github/workflows/fire-numbered-records-v2-source-contract.yml'
permissions:
  contents: read
jobs:
  numbered-records-v2:
    name: Focused new backup v2 pack/read refusal checks only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new versioned archive preservation and failure refusal
        run: node business-app-parity/shared/scripts/test-numbered-records-v2.mjs
      - name: Verify full financial, signed agreement, and photo-scoped v2 capture (new tests only)
        run: node --experimental-sqlite business-app-parity/shared/scripts/test-numbered-records-v2-integrity.mjs
      - name: Test numbered recovery against authentic QA 25 migration schema (NEW)
        run: node --experimental-sqlite business-app-parity/restore-lab/test_actual_qa25_numbered_restore.mjs
      - name: Test disposable SQLite full-record parity and atomic numbering rollback
        run: node --experimental-sqlite business-app-parity/restore-lab/test_restore_numbered_mappings_memory.mjs
