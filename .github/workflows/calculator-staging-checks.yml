name: FIRE Calculator Staging Checks

on:
  push:
    branches:
      - fire-calculator-best-of-both
    paths:
      - 'calculator/**'
      - '.github/workflows/calculator-staging-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-staging:
    name: Validate isolated calculator staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find calculator -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find calculator/tests -maxdepth 1 -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Best-of-both contract and offline manifest
        run: node calculator/tests/best-of-both-contract.mjs
      - name: FIRE formula regression
        run: node calculator/tests/formula-regression.js
      - name: Best-of-both preset chemistry regression
        run: node calculator/tests/best-of-both-preset-math.js
      - name: Offline cache contract
        run: node calculator/tests/offline-cache-contract.mjs
      - name: Backup hydration simulated runtime
        run: node calculator/tests/backup-hydration-runtime.mjs
      - name: Imported helper simulated runtime
        run: node calculator/tests/imported-helper-runtime.mjs
      - name: Isolated served-build smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/fire-calculator-staging-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/calculator/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node calculator/tests/staging-deployment-smoke.mjs http://127.0.0.1:4173/calculator/
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fire-best-of-both-playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start browser-acceptance staging server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/fire-calculator-browser-http.log 2>&1 &
          echo $! >/tmp/fire-calculator-browser-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/calculator/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/fire-calculator-browser-http.log
          exit 1
      - name: Browser offline and persistence acceptance
        env:
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_VISUAL_OUT: calculator/visual-parity
        run: node calculator/tests/offline-dr-acceptance.mjs
      - name: External commit-pinned staging smoke
        env:
          FIRE_EXTERNAL_STAGING_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.sha }}/calculator/
        run: node calculator/tests/staging-deployment-smoke.mjs "$FIRE_EXTERNAL_STAGING_URL"
      - name: External mobile browser acceptance
        env:
          FIRE_STAGING_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.sha }}/calculator/
          FIRE_VISUAL_OUT: calculator/visual-parity-external
        run: node calculator/tests/offline-dr-acceptance.mjs
      - name: Package isolated staging candidate
        uses: actions/upload-artifact@v4
        with:
          name: fire-calculator-best-of-both-staging
          path: |
            calculator/
            assets/recent-work/fire-logo-direct.png
          retention-days: 14
          if-no-files-found: error
      - name: Release status
        run: |
          echo "Code-level staging checks complete."
          echo "Real-device acceptance and deployment verification are still required."
          echo "STAGING CANDIDATE ONLY — NOT SYNCHRONIZED."
