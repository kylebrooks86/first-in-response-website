name: FIRE G4 fourth STAGING operator offline
on:
  pull_request:
    paths:
      - 'business-app-parity/*fourth*'
      - '.github/workflows/fire-g4-fourth-operator.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse PowerShell without execution
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'business-app-parity/owner_staging_beta_private_fourth.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'PowerShell parser failed' }
      - name: Syntax and offline exclusive lock regression
        shell: pwsh
        run: |
          node --check business-app-parity/owner_staging_beta_private_fourth.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check business-app-parity/staging_beta_fourth_reservation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node business-app-parity/test-staging-beta-fourth-reservation.mjs
