name: FIRE Calculator Visual Parity

on:
  workflow_dispatch:
  push:
    branches:
      - fire-calculator-exact-live-clone
    paths:
      - 'calculator/SHARED_CORE_MANIFEST.json'
      - 'calculator/tests/**'
      - '.github/workflows/fire-calculator-visual-parity.yml'

concurrency:
  group: fire-calculator-visual-parity-${{ github.sha }}
  cancel-in-progress: true

jobs:
  behavior-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fire-playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start staging server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fire-calculator-server.log 2>&1 &
          echo $! > /tmp/fire-calculator-server.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/calculator/ >/dev/null

      - name: Compare live Job Math behavior
        id: jobmath
        timeout-minutes: 2
        continue-on-error: true
        env: &live-env
          FIRE_LIVE_URL: https://fire-field-calculator-fir.kylebrooks8605.chatgpt.site
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
        run: node calculator/tests/jobmath-live-parity.mjs
      - name: Compare live Job Math shortcuts
        id: shortcuts
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/jobmath-shortcuts-live-parity.mjs
      - name: Compare live Pricing Editor behavior
        id: pricing
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/pricing-live-parity.mjs
      - name: Compare live estimator edge states
        id: edges
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/estimator-edge-live-parity.mjs
      - name: Compare live customer and draft behavior
        id: customer
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/customer-live-parity.mjs
      - name: Compare live bundle and promotion behavior
        id: bundle
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/bundle-live-parity.mjs
      - name: Compare live save reload and clear behavior
        id: state
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/state-roundtrip-live-parity.mjs
      - name: Compare live quote copy share and print behavior
        id: export
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/export-live-parity.mjs
      - name: Compare live mobile numeric input behavior
        id: mobileinputs
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/mobile-input-live-parity.mjs
      - name: Compare live chemical compatibility behavior
        id: compatibility
        timeout-minutes: 2
        continue-on-error: true
        env: *live-env
        run: node calculator/tests/compatibility-live-parity.mjs
      - name: Verify live backup restores into DR
        id: takeover
        timeout-minutes: 2
        continue-on-error: true
        env:
          FIRE_LIVE_URL: https://fire-field-calculator-fir.kylebrooks8605.chatgpt.site
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_VISUAL_OUT: calculator/visual-parity
        run: node calculator/tests/backup-takeover-live-parity.mjs

      - name: Enforce Job Math parity result
        if: steps.jobmath.outcome == 'failure'
        run: exit 1
      - name: Enforce Job Math shortcut parity result
        if: steps.shortcuts.outcome == 'failure'
        run: exit 1
      - name: Enforce Pricing Editor parity result
        if: steps.pricing.outcome == 'failure'
        run: exit 1
      - name: Enforce estimator edge-state parity result
        if: steps.edges.outcome == 'failure'
        run: exit 1
      - name: Enforce customer and draft parity result
        if: steps.customer.outcome == 'failure'
        run: exit 1
      - name: Enforce bundle and promotion parity result
        if: steps.bundle.outcome == 'failure'
        run: exit 1
      - name: Enforce save reload and clear parity result
        if: steps.state.outcome == 'failure'
        run: exit 1
      - name: Enforce quote copy share and print behavior
        if: steps.export.outcome == 'failure'
        run: exit 1
      - name: Enforce mobile numeric input parity result
        if: steps.mobileinputs.outcome == 'failure'
        run: exit 1
      - name: Enforce chemical compatibility parity result
        if: steps.compatibility.outcome == 'failure'
        run: exit 1
      - name: Enforce live backup to DR takeover
        if: steps.takeover.outcome == 'failure'
        run: exit 1

  visual-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fire-playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install visual diff tools
        run: npm install --no-save playwright@1.55.0 pngjs@7.0.0 pixelmatch@6.0.0
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start staging server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fire-calculator-server.log 2>&1 &
          echo $! > /tmp/fire-calculator-server.pid
          mkdir -p calculator/visual-parity/focused
          sleep 2
          curl --fail http://127.0.0.1:4173/calculator/ >/dev/null

      - name: Inspect Equipment key-card geometry
        timeout-minutes: 1
        continue-on-error: true
        env:
          FIRE_LIVE_URL: https://fire-field-calculator-fir.kylebrooks8605.chatgpt.site
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_KEY_CARD_GROUP: equipment
        run: node calculator/tests/key-card-internals-live-parity.mjs 2>&1 | tee calculator/visual-parity/focused/equipment.log
      - name: Inspect Job Math key-card geometry
        timeout-minutes: 1
        continue-on-error: true
        env:
          FIRE_LIVE_URL: https://fire-field-calculator-fir.kylebrooks8605.chatgpt.site
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_KEY_CARD_GROUP: jobmath
        run: node calculator/tests/key-card-internals-live-parity.mjs 2>&1 | tee calculator/visual-parity/focused/jobmath.log
      - name: Inspect Field Tools key-card geometry
        timeout-minutes: 1
        continue-on-error: true
        env:
          FIRE_LIVE_URL: https://fire-field-calculator-fir.kylebrooks8605.chatgpt.site
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_KEY_CARD_GROUP: tools
        run: node calculator/tests/key-card-internals-live-parity.mjs 2>&1 | tee calculator/visual-parity/focused/tools.log
      - name: Upload focused geometry logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fire-calculator-focused-geometry
          path: calculator/visual-parity/focused
          if-no-files-found: warn
          retention-days: 14
      - name: Measure live and staging card geometry
        timeout-minutes: 2
        continue-on-error: true
        env: &visual-env
          FIRE_LIVE_URL: https://fire-field-calculator-fir.kylebrooks8605.chatgpt.site
          FIRE_STAGING_URL: http://127.0.0.1:4173/calculator/
          FIRE_VISUAL_OUT: calculator/visual-parity
        run: node calculator/tests/card-geometry-live-parity.mjs
      - name: Measure live and staging layout geometry
        timeout-minutes: 2
        continue-on-error: true
        env: *visual-env
        run: node calculator/tests/layout-geometry.mjs
      - name: Inspect computed light/dark style differences
        timeout-minutes: 2
        continue-on-error: true
        env: *visual-env
        run: node calculator/tests/style-live-parity.mjs
      - name: Inspect live bundle and customer baseline
        timeout-minutes: 2
        continue-on-error: true
        env: *visual-env
        run: node calculator/tests/jobmath-baseline-audit.mjs
      - name: Capture live and staging at iPhone viewport
        timeout-minutes: 2
        continue-on-error: true
        env: *visual-env
        run: node calculator/tests/visual-parity.mjs
      - name: Measure light and dark visual differences
        if: always()
        continue-on-error: true
        env:
          FIRE_VISUAL_OUT: calculator/visual-parity
        run: node calculator/tests/visual-diff-report.mjs
      - name: Upload paired screenshots and diff report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fire-calculator-visual-parity
          path: calculator/visual-parity
          if-no-files-found: warn
          retention-days: 14
