name: Run verifier cleanup

on:
  push:
    paths:
      - '.github/workflows/run-verifier-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verifier cleanup
        run: python patch-verifier-cleanup.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean verifier media and stale house wash tokens'
          git push
